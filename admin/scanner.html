<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner — Admin · Engineering Office</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
// ---- Resilient loader for the html5-qrcode library ----------------------
// A single hard-coded CDN tag fails silently when that CDN is blocked/offline,
// which surfaced as "Html5Qrcode is not defined". We now load it on demand and
// fall back across mirrors, reporting a clear message if all of them fail.
const QR_LIB_SOURCES = [
  'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
  'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js'
];
let qrLibPromise = null;
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => { s.remove(); reject(new Error('Failed to load '+src)); };
    document.head.appendChild(s);
  });
}
function ensureQrLib(){
  if(typeof window.Html5Qrcode !== 'undefined') return Promise.resolve();
  if(qrLibPromise) return qrLibPromise;
  qrLibPromise = (async () => {
    for(const url of QR_LIB_SOURCES){
      try {
        await loadScript(url);
        if(typeof window.Html5Qrcode !== 'undefined') return;
      } catch(_){ /* try next mirror */ }
    }
    qrLibPromise = null;
    throw new Error('QR scanning library could not be loaded. Check your internet connection and reload the page.');
  })();
  return qrLibPromise;
}

let scanner = null;
let SELECTED = new Set();   // intern IDs ticked for bulk schedule assignment
let lastScannedAt = 0;
let cameraStarted = false;
let permissionState = 'unknown'; // 'granted' | 'denied' | 'prompt' | 'unknown'

async function render(){
  const admin = await requireAdmin(); if(!admin) return;
  const sch = getOfficeSchedule();
  document.getElementById('shell').innerHTML = renderSidebar('admin','scanner') + `
    <main class="main">
      ${renderTopbar('QR Scanner & Schedule', 'First scan of the day records Time In, the second records Time Out. Status follows the office schedule below.')}


      <div class="card">
        <div class="card-title" style="margin-bottom:4px">Assign Schedule to Interns</div>
        <p class="text-sm text-muted" style="margin:0 0 12px">
          Pick the OJT dates and shift, tick the interns on the left, then apply.
        </p>
        <div class="scanner-settings">
          <div class="form-group"><label for="a_sdate">Start Date</label>
            <input type="date" class="form-control" id="a_sdate"></div>
          <div class="form-group"><label for="a_edate">End Date</label>
            <input type="date" class="form-control" id="a_edate"></div>
          <div class="form-group"><label for="a_tin">Time In</label>
            <input type="time" class="form-control" id="a_tin" value="${sch.start_time}"></div>
          <div class="form-group"><label for="a_tout">Time Out</label>
            <input type="time" class="form-control" id="a_tout" value="${sch.end_time || '17:00'}"></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 10px">
          <label class="sr-only" for="schSearch">Search interns</label>
          <input class="form-control" id="schSearch" placeholder="Search intern…" style="flex:1;min-width:180px" oninput="drawSchedList(this.value)">
          <button class="btn btn-outline btn-sm" onclick="selectAllInterns(true)">Select all</button>
          <button class="btn btn-outline btn-sm" onclick="selectAllInterns(false)">Clear</button>
        </div>
        <div class="sched-list" id="schedList" role="group" aria-label="Interns to assign the schedule to"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap">
          <span class="text-sm text-muted" id="selCount" aria-live="polite">0 interns selected</span>
          <button class="btn btn-primary" id="applyBtn" onclick="applySchedule()">Apply Schedule to Selected</button>
        </div>
      </div>

      <div class="card">
          <div class="card-title">Camera</div>
          <div id="permBanner" class="camera-msg" role="status" aria-live="polite" style="display:none;background:#fff8e1;color:#8a6d0f;border:1px solid #f2d97a;padding:10px 12px;border-radius:8px;margin-bottom:10px"></div>
          <div id="reader" style="width:100%;max-width:420px;margin:0 auto"></div>
          <div id="camMsg" class="camera-msg" role="alert" aria-live="assertive" style="display:none"></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" id="startCamBtn" onclick="requestAndStart()">Enable Camera</button>
            <button class="btn btn-outline btn-sm" onclick="stopCamera()">Stop Camera</button>
          </div>
          <div class="text-muted text-sm mt-2">Or enter Intern ID manually:</div>
          <div style="display:flex;gap:8px;margin-top:6px">
            <label class="sr-only" for="manual">Intern ID</label>
            <input class="form-control" id="manual" aria-label="Intern ID" placeholder="OJT-2025-001">
            <button class="btn btn-primary" onclick="scanManual()">Scan</button>
          </div>
        </div>
        </div>
    </main>`;
  startClock('#clockBox');
  drawSchedList('');
  drawLog();
  setInterval(drawLog, 60000); // keep pending/late/absent statuses live
  await checkPermission();
  // Warm up the QR library in the background (non-blocking).
  ensureQrLib().catch(e => setPermBanner(e.message, 'error'));
}

async function saveSchedule(){
  const start  = document.getElementById('s_start').value || '08:00';
  const end    = document.getElementById('s_end').value || '17:00';
  const grace  = +document.getElementById('s_grace').value || 0;
  const absent = +document.getElementById('s_absent').value || 60;
  const brk    = +document.getElementById('s_break').value || 0;

  if(end <= start){ toast('Shift time out must be later than time in.','error'); return; }
  if(absent <= grace){ toast('“Absent after” must be greater than the grace period.','error'); return; }

  const btn = document.getElementById('saveSchedBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const r = await setOfficeSchedule({
    start_time:start, end_time:end, grace_minutes:grace,
    absent_after_minutes:absent, break_minutes:brk
  });
  btn.disabled = false; btn.textContent = 'Save Schedule';
  if(!r.ok){ toast('Saved on this device only: '+r.error,'error'); }
  else toast('Schedule saved and applied to all interns.','success');
  drawSchedList(document.getElementById('schSearch').value);
  drawLog();
}

/* ---------------- intern selection list (checkbox on the LEFT) ------------- */
function activeInterns(){ return window.__DB__.students.filter(s=>s.active !== false); }

function drawSchedList(q){
  const term = (q||'').toLowerCase().trim();
  const list = activeInterns().filter(s=>
    !term || s.name.toLowerCase().includes(term) || String(s.id).toLowerCase().includes(term)
  ).sort((a,b)=>a.name.localeCompare(b.name));

  const el = document.getElementById('schedList');
  el.innerHTML = list.map(s=>`
    <div class="sched-row">
      <input type="checkbox" id="sel_${escapeAttr(s.id)}" ${SELECTED.has(s.id)?'checked':''}
             onchange="toggleSel('${escapeAttr(s.id)}', this.checked)"
             aria-label="Select ${escapeAttr(s.name)}">
      ${profileIconHTML(s,32)}
      <label class="sched-meta" for="sel_${escapeAttr(s.id)}" style="cursor:pointer">
        <strong>${escapeHtml(s.name)}</strong>
        <small>${escapeHtml(s.id)}</small>
      </label>
      <span class="sched-time">${fmt12(s.expected_time_in)} – ${fmt12(s.expected_time_out)}</span>
    </div>`).join('') ||
    '<div style="padding:16px;text-align:center;color:#888">No interns found.</div>';
  updateSelCount();
}
function toggleSel(id, on){ on ? SELECTED.add(id) : SELECTED.delete(id); updateSelCount(); }
function selectAllInterns(on){
  const term = (document.getElementById('schSearch').value||'').toLowerCase().trim();
  activeInterns().forEach(s=>{
    const match = !term || s.name.toLowerCase().includes(term) || String(s.id).toLowerCase().includes(term);
    if(match) on ? SELECTED.add(s.id) : SELECTED.delete(s.id);
  });
  drawSchedList(document.getElementById('schSearch').value);
}
function updateSelCount(){
  const n = SELECTED.size;
  document.getElementById('selCount').textContent = `${n} intern${n===1?'':'s'} selected`;
}

async function applySchedule(){
  const ids = [...SELECTED];
  if(!ids.length){ toast('Select at least one intern first.','error'); return; }
  const sd = document.getElementById('a_sdate').value;
  const ed = document.getElementById('a_edate').value;
  const tin = document.getElementById('a_tin').value;
  const tout = document.getElementById('a_tout').value;
  // Break duration is inherited from the office schedule (no per-apply input).
  const _os = getOfficeSchedule() || {};
  const brk = (_os.break_minutes == null ? 60 : +_os.break_minutes);

  if(!tin || !tout){ toast('Time in and time out are required.','error'); return; }
  if(tout <= tin){ toast('Time out must be later than time in.','error'); return; }
  if(sd && ed && ed < sd){ toast('End date cannot be before the start date.','error'); return; }

  const ok = await confirmDialog({
    title:'Apply schedule',
    message:`Apply ${fmt12(tin)} – ${fmt12(tout)} with the standard ${brk}-minute break to ${ids.length} intern(s)?`,
    confirmText:'Apply'
  });
  if(!ok) return;

  const btn = document.getElementById('applyBtn');
  btn.disabled = true; btn.textContent = 'Applying…';
  const r = await applyScheduleToStudents(ids, {
    expected_time_in:tin, expected_time_out:tout, break_minutes:brk,
    start_date: sd || undefined, end_date: ed || undefined
  });
  btn.disabled = false; btn.textContent = 'Apply Schedule to Selected';
  if(!r.ok){ toast(r.error,'error'); }
  else { toast(`Schedule applied to ${r.count} intern(s).`,'success'); SELECTED.clear(); }
  drawSchedList(document.getElementById('schSearch').value);
  drawLog();
}

function setPermBanner(html, kind){
  const el = document.getElementById('permBanner');
  if(!html){ el.style.display='none'; return; }
  el.style.display = 'block';
  el.innerHTML = html;
  el.style.background = kind==='error' ? '#fdecea' : kind==='ok' ? '#e6f4ea' : '#fff8e1';
  el.style.color = kind==='error' ? '#8a1c1c' : kind==='ok' ? '#0f5132' : '#8a6d0f';
  el.style.borderColor = kind==='error' ? '#f2b1ac' : kind==='ok' ? '#a7d7b6' : '#f2d97a';
}

// Median / Android WebView wrappers do not implement the Permissions API for
// the camera (and some report "denied" even when the app has the OS camera
// permission), which used to permanently disable the Enable Camera button.
// The Permissions API is therefore ADVISORY ONLY: the button always stays
// clickable and the real answer comes from getUserMedia on a user gesture.
function isWrappedApp(){
  const ua = navigator.userAgent || '';
  return /median|gonative|; wv\)|WebView/i.test(ua) ||
         (/Android/i.test(ua) && !/Chrome\/\d+/i.test(ua));
}

async function checkPermission(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setPermBanner('This browser does not support camera access.', 'error');
    return;
  }
  // Secure context requirement — camera APIs are blocked over plain HTTP.
  // (Median/WebView apps load the https:// site, so this only affects browsers.)
  if(!window.isSecureContext){
    setPermBanner('Camera requires a secure connection. Open this page over <strong>https://</strong> or <strong>localhost</strong> to enable scanning.', 'error');
    return;
  }
  if(!isWrappedApp()){
    try {
      if(navigator.permissions && navigator.permissions.query){
        const st = await navigator.permissions.query({ name:'camera' });
        permissionState = st.state;
        applyPermState();
        st.onchange = () => { permissionState = st.state; applyPermState(); };
        return;
      }
    } catch(_){}
  }
  permissionState = 'prompt';
  applyPermState();
}

function applyPermState(){
  const btn = document.getElementById('startCamBtn');
  // The button is NEVER disabled: a blocked state can be fixed by the user and
  // retried straight away (especially inside the Median app).
  if(btn){ btn.disabled = false; }
  if(permissionState === 'granted'){
    setPermBanner('Camera permission granted. Click <strong>Enable Camera</strong> to start scanning.', 'ok');
    if(btn) btn.textContent = 'Enable Camera';
  } else if(permissionState === 'denied'){
    setPermBanner(
      'Camera access was <strong>blocked</strong>. In the app: open your phone\u2019s <strong>Settings \u2192 Apps \u2192 (this app) \u2192 Permissions \u2192 Camera \u2192 Allow</strong>, then tap <strong>Try Camera Again</strong>. In a browser: tap the camera icon in the address bar (or Site Settings) and allow the camera.',
      'error');
    if(btn) btn.textContent = 'Try Camera Again';
  } else {
    setPermBanner('Tap <strong>Enable Camera</strong> and allow camera access when asked.', 'warn');
    if(btn) btn.textContent = 'Enable Camera';
  }
}

// Progressive constraint list — WebView wrappers frequently reject
// {facingMode:{exact:'environment'}} and only accept a plain or deviceId
// constraint, so every option is tried before giving up.
async function probeCameraStream(){
  const tries = [
    { video: { facingMode: { ideal: 'environment' } }, audio: false },
    { video: { facingMode: 'environment' }, audio: false },
    { video: true, audio: false }
  ];
  let lastErr = null;
  for(const c of tries){
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch(e){
      lastErr = e;
      // A denied permission will not be fixed by another constraint.
      if(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) break;
    }
  }
  throw lastErr || new Error('Camera unavailable');
}

async function requestAndStart(){
  const btn = document.getElementById('startCamBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Starting\u2026'; }
  setPermBanner('Requesting camera access\u2026', 'warn');
  try {
    // Explicit permission prompt via getUserMedia — required user gesture.
    const stream = await probeCameraStream();
    // Release the probe stream immediately; html5-qrcode manages its own.
    stream.getTracks().forEach(t => t.stop());
    permissionState = 'granted';
    applyPermState();
    await startCamera();
  } catch(e){
    const name = (e && e.name) || '';
    const err  = String((e && e.message) || e);
    if(name === 'NotAllowedError' || name === 'SecurityError' || /NotAllowed|Permission|denied/i.test(err)){
      permissionState = 'denied';
      applyPermState();
    } else if(name === 'NotFoundError' || name === 'OverconstrainedError' || /NotFound|no device/i.test(err)){
      permissionState = 'prompt';
      applyPermState();
      setPermBanner('No usable camera was found on this device. You can still type the Intern ID manually below.', 'error');
    } else if(name === 'NotReadableError' || /in use|TrackStart/i.test(err)){
      permissionState = 'prompt';
      applyPermState();
      setPermBanner('The camera is already being used by another app. Close it and tap <strong>Enable Camera</strong> again.', 'error');
    } else {
      permissionState = 'prompt';
      applyPermState();
      setPermBanner('Cannot access camera: '+err+' \u2014 tap <strong>Enable Camera</strong> to retry.', 'error');
    }
  }
}

async function startCamera(){
  const msg = document.getElementById('camMsg');
  msg.style.display = 'none';
  try {
    await ensureQrLib();
    if(!scanner) scanner = new Html5Qrcode('reader');
    if(cameraStarted) return;
    const config = { fps:10, qrbox:250 };
    // Ordered fallbacks: rear camera → any environment camera → an explicit
    // rear deviceId → the first camera the device exposes. WebView wrappers
    // (Median) often only succeed on one of the later options.
    const attempts = [
      () => scanner.start({ facingMode:{ exact:'environment' } }, config, onScan, ()=>{}),
      () => scanner.start({ facingMode:'environment' }, config, onScan, ()=>{}),
      async () => {
        const cams = await Html5Qrcode.getCameras();
        if(!cams || !cams.length) throw new Error('No camera found');
        const back = cams.find(c => /back|rear|environment/i.test(c.label || '')) || cams[cams.length-1];
        return scanner.start({ deviceId:{ exact: back.id } }, config, onScan, ()=>{});
      },
      async () => {
        const cams = await Html5Qrcode.getCameras();
        if(!cams || !cams.length) throw new Error('No camera found');
        return scanner.start({ deviceId:{ exact: cams[0].id } }, config, onScan, ()=>{});
      }
    ];
    let started = false, lastErr = null;
    for(const attempt of attempts){
      try { await attempt(); started = true; break; }
      catch(e){ lastErr = e; }
    }
    if(!started) throw lastErr || new Error('Camera could not be started');
    cameraStarted = true;
    const b = document.getElementById('startCamBtn'); if(b) b.textContent = 'Camera Active';
  } catch(e){
    msg.style.display = 'block';
    msg.textContent = 'Cannot start camera: '+(e && e.message || e)+
      ' — tap Enable Camera to retry, or type the Intern ID manually below.';
    const b = document.getElementById('startCamBtn');
    if(b){ b.disabled = false; b.textContent = 'Try Camera Again'; }
  }
}
async function stopCamera(){
  try {
    if(scanner && cameraStarted){
      await scanner.stop(); await scanner.clear(); cameraStarted=false;
      const b = document.getElementById('startCamBtn'); if(b && !b.disabled) b.textContent = 'Enable Camera';
    }
  } catch(_){}
}

async function onScan(text){
  const now = Date.now();
  if(now - lastScannedAt < 1500) return;
  lastScannedAt = now;
  const st = resolveQR(text);
  if(!st){ toast('Unknown QR code','error'); return; }
  const r = await scanAttendance(st.id);
  if(!r.ok){ toast(r.error,'error'); return; }
  if(r.already){
    toast(`${st.name} already timed out at ${fmt12(r.time)}.`,'info');
  } else if(r.kind === 'out'){
    toast(`${st.name} — TIME OUT at ${fmt12(r.time)} · ${Number(r.hours||0).toFixed(2)} hrs rendered`,'success');
  } else {
    toast(`${st.name} — TIME IN at ${fmt12(r.time)} (${r.status.toUpperCase()})`, r.status==='present'?'success':'error');
  }
  drawLog();
}
async function scanManual(){
  const v = document.getElementById('manual').value.trim();
  if(!v) return;
  await onScan(v);
  document.getElementById('manual').value = '';
}

function drawLog(){
  const el = document.getElementById('log');
  if(!el) return;
  const today = todayStr();
  const rows = window.__DB__.attendance
    .filter(a=>a.date===today && a.time_in && !a.deleted_at)
    .map(a=>{
      const s = window.__DB__.students.find(x=>x.id===a.student_id);
      return { id:a.student_id, name:(s&&s.name)||'—', student:s, rec:a };
    })
    .sort((a,b)=>String(b.rec.time_in).localeCompare(String(a.rec.time_in)));

  el.innerHTML = rows.map(r=>{
    const st = shiftStatusFor(r.student, r.rec);
    return `
    <tr>
      <td style="font-weight:700;color:var(--blue-800)">${escapeHtml(r.id)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${fmt12(r.rec.time_in)}</td>
      <td>${r.rec.time_out ? fmt12(r.rec.time_out) : '<span class="text-muted">Awaiting 2nd scan</span>'}</td>
      <td><span class="badge badge-${st.key}">${escapeHtml(st.label)}</span></td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:#888;padding:16px">No scans yet today.</td></tr>';
}

render();
subscribeRealtime(() => render());
window.addEventListener('beforeunload', stopCamera);
</script>
</body>
</html>
