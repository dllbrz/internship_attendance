<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Settings — Admin · Engineering Office</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/image-crop.js"></script>
<script>
let CURRENT_ADMIN = null;
let ADMINS = [];
let EDIT_INTERN_ID = null;

async function render(){
  CURRENT_ADMIN = await requireAdmin();
  if(!CURRENT_ADMIN) return;
  // Mirror a just-confirmed email change into the local session view.
  try { await syncOwnEmailFromAuth(); } catch(_){}

  document.getElementById('shell').innerHTML = renderSidebar('admin','account') + `
    <main class="main">
      ${renderTopbar('Account Settings','Edit your admin profile, manage administrators, and update intern accounts.')}

      <!-- Admin's own profile -->
      <div class="card">
        <div class="card-head"><div class="card-title">My Admin Profile</div></div>
        <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
          <div class="avatar" style="width:96px;height:96px;font-size:28px;overflow:hidden;border-radius:50%;flex-shrink:0">
            ${CURRENT_ADMIN.avatar ? `<img src="${CURRENT_ADMIN.avatar}" alt="" style="width:100%;height:100%;object-fit:cover">` : (CURRENT_ADMIN.name||'A').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
          </div>
          <div style="flex:1;min-width:240px">
            <div class="form-group"><label>Display Name / Username</label>
              <input class="form-control" id="admName" value="${escapeAttr(CURRENT_ADMIN.name||'')}"></div>
            <div class="form-group">
              <label for="admEmail">Email Address</label>
              <input class="form-control" type="email" id="admEmail" autocomplete="email"
                     value="${escapeAttr(CURRENT_ADMIN.email||'')}" aria-describedby="admEmailHint">
              <small class="text-muted text-sm" id="admEmailHint">A confirmation link is sent to the new address. Sign in with your current email until you confirm it.</small>
            </div>
          </div>
          <div>
            <input type="file" id="admPic" accept="image/*" style="display:none" onchange="admUploadPic(event)">
            <button class="btn btn-primary btn-sm" onclick="openModal('admProfileMenuModal')">Edit Profile</button>
          </div>
        </div>
      </div>

      <!-- Single "Edit Profile" entry point → pop-up with the 4 profile actions -->
      <div class="modal" id="admProfileMenuModal" role="dialog" aria-modal="true" aria-label="Edit profile options">
        <div class="modal-inner" style="max-width:400px">
          <div class="modal-head"><h3>Edit Profile</h3><button class="close-x" aria-label="Close" onclick="closeModal('admProfileMenuModal')">&times;</button></div>
          <div class="modal-body">
            <div class="view-menu">
              <button type="button" onclick="closeModal('admProfileMenuModal'); document.getElementById('admPic').click()">Upload / Change Photo</button>
              <button type="button" class="danger" id="delPicBtn"
                      onclick="closeModal('admProfileMenuModal'); admDelPic()"
                      aria-label="Delete profile photo">Delete Photo</button>
              <button type="button" onclick="closeModal('admProfileMenuModal'); admSaveName()">Save Name</button>
              <button type="button" id="admEmailBtn" onclick="closeModal('admProfileMenuModal'); admSaveEmail()">Change Email</button>
            </div>
            <p class="text-muted text-sm mt-3">Changes to your display name and email use the values currently typed into the fields above.</p>
          </div>
          <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal('admProfileMenuModal')">Close</button></div>
        </div>
      </div>

      <div class="card-grid-2">
        <div class="card">
          <div class="card-head"><div class="card-title">Change Password</div></div>
          <form onsubmit="chPass(event)">
            <div class="form-row">
              <div class="form-group"><label>New Password</label><input class="form-control" type="password" id="n1" required minlength="8"></div>
              <div class="form-group"><label>Confirm</label><input class="form-control" type="password" id="n2" required minlength="8"></div>
            </div>
            <p class="text-muted text-sm">Minimum 8 characters. You'll stay signed in.</p>
            <button class="btn btn-primary">Update Password</button>
          </form>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Add Administrator</div></div>
          <form onsubmit="addAdmin(event)">
            <div class="form-group"><label for="an">Full Name</label><input class="form-control" id="an" required></div>
            <div class="form-group"><label for="ae">Email</label>
              <input class="form-control" type="email" id="ae" required placeholder="name@naic.gov.ph"></div>

            <p class="text-muted text-sm" id="admHint">An invitation email with a secure sign-in link is sent automatically. The new administrator sets their own password when they accept. The <code>admin</code> role is granted on acceptance — invited admins are never added as interns.</p>
            <button class="btn btn-yellow" id="addAdminBtn">Send Invitation</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Administrators</div>
          <button class="btn btn-ghost btn-sm" onclick="loadAdmins()">Refresh</button>
        </div>
        <div class="table-wrap" id="adminTable"><div class="text-muted p-4">Loading…</div></div>
      </div>
    </main>`;
  startClock('#clockBox');
  await loadAdmins();
}

async function loadAdmins(){
  const wrap = document.getElementById('adminTable');
  wrap.innerHTML = '<div class="text-muted p-4">Loading…</div>';
  const r = await adminManage('list');
  if(!r.ok){ wrap.innerHTML = `<div class="p-4" style="color:var(--red)">${escapeHtml(r.error)}</div>`; return; }
  ADMINS = r.data.admins || [];
  wrap.innerHTML = `<table>
    <thead><tr><th>Name</th><th>Email</th><th>Created</th><th>Role</th><th style="text-align:right">Action</th></tr></thead>
    <tbody>${ADMINS.map(a=>`
      <tr>
        <td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.email)}</td>
        <td>${new Date(a.created_at).toLocaleDateString()}</td>
        <td><span class="pill blue">Admin</span></td>
        <td style="text-align:right">${a.is_self ? '<span class="text-muted text-sm">You</span>'
          : `<button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="delAdmin('${a.id}','${escapeAttr(a.email)}')">Remove</button>`}</td>
      </tr>`).join('')}</tbody></table>`;
}


function openIntern(id){
  const s = getDB().students.find(x=>x.id===id); if(!s) return;
  EDIT_INTERN_ID = id;
  document.getElementById('i_name').textContent = `${s.name} · ${s.id}`;
  document.getElementById('i_full').value = s.name || '';
  document.getElementById('i_phone').value = s.phone || '';
  document.getElementById('i_school').value = s.school || '';
  document.getElementById('i_course').value = s.course || '';
  document.getElementById('i_addr').value = s.address || '';
  document.getElementById('i_adv').value = s.adviser_name || '';
  document.getElementById('i_advc').value = s.adviser_contact || '';
  document.getElementById('i_start').value = s.start_date || '';
  document.getElementById('i_end').value = s.end_date || '';
  document.getElementById('i_hours').value = s.required_hours || '';
  document.getElementById('i_tin').value = s.expected_time_in || '08:00';
  document.getElementById('i_err').textContent = '';
  openModal('internModal');
}


async function chPass(e){
  e.preventDefault();
  if(n1.value !== n2.value){ toast('Passwords do not match','error'); return; }
  const r = await updateCurrentPassword(n1.value);
  if(!r.ok){ toast(r.error,'error'); return; }
  n1.value = ''; n2.value = '';
  toast('Password changed','success');
}

async function addAdmin(e){
  e.preventDefault();
  const name  = document.getElementById('an').value.trim();
  const email = document.getElementById('ae').value.trim();

  const ok = await confirmDialog({
    title: 'Send admin invitation',
    message: `Send an invitation link to ${email}? They will be able to sign in as an administrator.`,
    confirmText: 'Send Invitation'
  });
  if(!ok) return;

  const btn = document.getElementById('addAdminBtn');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sending…';
  const r = await inviteAdmin(email, name);
  btn.disabled = false; btn.textContent = label;
  if(!r.ok){ toast(r.error,'error'); return; }

  document.getElementById('an').value = '';
  document.getElementById('ae').value = '';
  toast(`Invitation sent to ${email}.`,'success');
  await loadAdmins();
}

async function delAdmin(userId, email){
  const ok = await confirmDelete(`Delete admin ${email}? This removes their account permanently.`, 'Remove administrator');
  if(!ok) return;
  const r = await adminManage('delete', { user_id: userId });
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Administrator removed','success');
  await loadAdmins();
}

async function admSaveName(){
  const name = document.getElementById('admName').value.trim();
  if(!name){ toast('Name cannot be empty','error'); return; }
  const r = await updateAdminSelf({ full_name:name });
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Profile updated','success'); render();
}
async function admSaveEmail(){
  const input = document.getElementById('admEmail');
  const email = (input.value||'').trim().toLowerCase();
  const current = ((CURRENT_ADMIN && CURRENT_ADMIN.email)||'').trim().toLowerCase();
  if(!email){ toast('Email cannot be empty','error'); input.focus(); return; }
  if(email === current){ toast('That is already your current email address.','info'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Enter a valid email address.','error'); input.focus(); return; }
  const ok = await confirmDialog({
    title: 'Change email address',
    message: `Send a One Time Pin to ${email}? You will be asked to enter that pin to finish the change.`,
    confirmText: 'Send One Time Pin',
    danger: false
  });
  if(!ok) return;
  const btn = document.getElementById('admEmailBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  const r = await requestEmailChangeOtp(email);
  if(btn){ btn.disabled = false; btn.textContent = 'Change Email'; }
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('One Time Pin sent to '+email+'.','success');
  await verifyAdminEmailChange(email);
}

// Pop-up verification: One Time Pin + the word CONFIRM.
async function verifyAdminEmailChange(email){
  for(;;){
    const res = await otpConfirmDialog({
      title: 'Verify your new email address',
      message: 'We emailed a One Time Pin to '+email+'. Enter the pin, then type CONFIRM to change your email address.',
      email,
      confirmText: 'Verify & Change Email',
      onResend: async () => {
        const again = await requestEmailChangeOtp(email);
        toast(again.ok ? 'A new One Time Pin was sent to '+email+'.' : (again.error||'Could not resend the pin.'),
              again.ok ? 'success' : 'error');
      }
    });
    if(!res){ toast('Email change cancelled. Your current email address is unchanged.','info'); return; }
    const v = await verifyEmailChangeOtp(email, res.code);
    if(v.ok){
      toast('Email address changed to '+email+'.','success');
      render();
      return;
    }
    toast(v.error,'error');
  }
}
async function admUploadPic(e){
  const input = e.target;
  const f = input.files[0];
  // reset so re-selecting the same file re-triggers change
  try { input.value = ''; } catch(_){}
  if(!f) return;
  if(f.size > 15*1024*1024){ toast('Image too large (max 15 MB before cropping).','error'); return; }
  let blob;
  try {
    blob = await window.openImageCropper(f, {
      aspectRatio: 1, outputSize: 512, filename: 'admin-avatar.png', mimeType: 'image/png'
    });
  } catch(err){
    // user cancelled the crop dialog — silent
    return;
  }
  const cropped = new File([blob], 'admin-avatar.png', { type: blob.type || 'image/png' });
  toast('Uploading…','info');
  const r = await uploadAdminAvatar(cropped);
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Photo updated','success'); render();
}
async function admDelPic(){
  if(!CURRENT_ADMIN.avatar){ toast('You have no profile photo to remove.','info'); return; }
  const ok = await confirmDelete('Remove your profile photo? Your initials will be shown instead.','Delete profile photo');
  if(!ok) return;
  const btn = document.getElementById('delPicBtn');
  btn.disabled = true; btn.textContent = 'Removing…';
  const r = await deleteAdminAvatar();
  btn.disabled = false; btn.textContent = 'Delete Photo';
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Photo removed','success'); render();
}

render();
subscribeRealtime(() => render());
</script>
</body>
</html>
