<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Students — Admin · Naic OJT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
async function render(){
  const admin = await requireAdmin(); if(!admin) return;
  const students = window.__DB__.students.filter(s=>s.active);
  document.getElementById('shell').innerHTML = renderSidebar('admin','students') + `
    <main class="main">
      ${renderTopbar('Students', 'Manage active OJT interns. Newly registered accounts appear here automatically.')}
      <div class="card">
        <div class="card-title">Active Interns (${students.length})</div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>ID</th><th>Name</th><th>School</th><th>Course</th><th>Period</th><th>Hrs</th><th>Documents</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Edit modal -->
    <div class="modal" id="editModal">
      <div class="modal-inner" style="max-width:460px">
        <div class="modal-head">
          <h3>Edit Student Schedule</h3>
          <button class="close-x" onclick="closeModal('editModal')" aria-label="Close dialog">×</button>
        </div>
        <div class="modal-body">
          <p class="text-muted text-sm">Set the OJT period, daily shift and the unpaid break deducted from rendered hours.</p>
          <input type="hidden" id="e_id">
          <div id="e_name" style="font-weight:700;color:var(--blue-900);margin-bottom:12px"></div>
          <div class="form-row">
            <div class="form-group"><label for="e_start">Start Date</label><input type="date" class="form-control" id="e_start"></div>
            <div class="form-group"><label for="e_end">End Date</label><input type="date" class="form-control" id="e_end"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="e_tin">Shift Time In</label><input type="time" class="form-control" id="e_tin"></div>
            <div class="form-group"><label for="e_tout">Shift Time Out</label><input type="time" class="form-control" id="e_tout"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="e_break">Break (minutes)</label>
              <select class="form-control" id="e_break">
                <option value="0">No break</option>
                <option value="30">30 minutes</option>
                <option value="60">1 hour (default)</option>
                <option value="90">1 hour 30 minutes</option>
              </select>
            </div>
            <div class="form-group"><label for="e_hours">Required Hours</label><input type="number" class="form-control" id="e_hours" min="1"></div>
          </div>
          <p class="text-sm text-muted" id="e_preview" aria-live="polite"></p>
          <div class="form-error" id="e_err" role="alert"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
          <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- Documents modal -->
    <div class="modal" id="docsModal">
      <div class="modal-inner" style="max-width:720px">
        <div class="modal-head">
          <h3 id="d_title">Uploaded Documents</h3>
          <button class="close-x" onclick="closeModal('docsModal')">×</button>
        </div>
        <div class="modal-body">
          <div id="d_body">Loading…</div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('docsModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- View Profile modal -->
    <div class="modal" id="profileModal">
      <div class="modal-inner" style="max-width:640px">
        <div class="modal-head">
          <h3>Student Profile</h3>
          <button class="close-x" onclick="closeModal('profileModal')">×</button>
        </div>
        <div class="modal-body" id="p_body">Loading…</div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('profileModal')">Close</button>
        </div>
      </div>
    </div>`;
  startClock('#clockBox');
  drawRows();
}
function drawRows(){
  const rows = document.getElementById('rows');
  const list = window.__DB__.students.filter(s=>s.active);
  rows.innerHTML = list.map(s=>{
    const n = (s.requirements||[]).length;
    return `
    <tr>
      <td style="font-weight:700;color:var(--blue-800)">${s.id}</td>
      <td>
        <div class="cell-name">
          ${profileIconHTML(s, 34)}
          <span class="name-text">${s.name}</span>
        </div>
      </td>
      <td>${s.school||'—'}</td>
      <td>${s.course||'—'}</td>
      <td>${fmtDate(s.start_date)} – ${fmtDate(s.end_date)}<div class="text-muted text-sm">${fmt12(s.expected_time_in)} – ${fmt12(s.expected_time_out)} · ${s.break_minutes||0}m break</div></td>
      <td>${s.required_hours}</td>
      <td><button class="btn btn-outline btn-sm" onclick="viewDocs('${s.id}')">View (${n})</button></td>
      <td style="white-space:nowrap">
        <button class="btn btn-outline btn-sm" onclick="viewProfile('${s.id}')">View Profile</button>
        <button class="btn btn-outline btn-sm" onclick="openEdit('${s.id}')">Edit</button>
        <button class="btn btn-outline btn-sm" style="color:#c53030;border-color:#c53030" onclick="archive('${s.id}')">Archive</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" style="text-align:center;color:#888">No active students yet.</td></tr>';
}
function openEdit(id){
  const s = window.__DB__.students.find(x=>x.id===id); if(!s) return;
  document.getElementById('e_id').value = s.id;
  document.getElementById('e_name').textContent = `${s.name} · ${s.id}`;
  document.getElementById('e_start').value = s.start_date;
  document.getElementById('e_end').value = s.end_date;
  document.getElementById('e_hours').value = s.required_hours;
  document.getElementById('e_tin').value = s.expected_time_in || '08:00';
  document.getElementById('e_tout').value = s.expected_time_out || '17:00';
  document.getElementById('e_break').value = String(s.break_minutes == null ? 60 : s.break_minutes);
  document.getElementById('e_err').textContent = '';
  ['e_tin','e_tout','e_break'].forEach(id=>{
    const el = document.getElementById(id);
    el.oninput = updatePreview; el.onchange = updatePreview;
  });
  updatePreview();
  openModal('editModal');
}
function shiftMinutes(){
  const a = document.getElementById('e_tin').value;
  const b = document.getElementById('e_tout').value;
  if(!a || !b) return null;
  const [ah,am]=a.split(':').map(Number), [bh,bm]=b.split(':').map(Number);
  return (bh*60+bm) - (ah*60+am);
}
function updatePreview(){
  const span = shiftMinutes();
  const brk = +document.getElementById('e_break').value || 0;
  const el = document.getElementById('e_preview');
  if(span == null){ el.textContent = ''; return; }
  if(span <= 0){ el.textContent = 'Time out must be later than time in.'; return; }
  const net = Math.max(0, span - brk);
  el.textContent = `Daily credited hours: ${(net/60).toFixed(2)} hrs (${(span/60).toFixed(2)} hrs shift \u2212 ${brk} min break).`;
}
async function saveEdit(){
  const id = document.getElementById('e_id').value;
  const err = document.getElementById('e_err');
  const start = document.getElementById('e_start').value;
  const end   = document.getElementById('e_end').value;
  const tin   = document.getElementById('e_tin').value;
  const tout  = document.getElementById('e_tout').value;
  const brk   = +document.getElementById('e_break').value;
  const hours = +document.getElementById('e_hours').value;

  if(!start || !end){ err.textContent = 'Start and end dates are required.'; return; }
  if(end < start){ err.textContent = 'End date cannot be before the start date.'; return; }
  if(!tin || !tout){ err.textContent = 'Shift time in and time out are required.'; return; }
  if(shiftMinutes() <= 0){ err.textContent = 'Shift time out must be later than time in.'; return; }
  if(shiftMinutes() <= brk){ err.textContent = 'The break is longer than the shift.'; return; }
  if(!hours || hours < 1){ err.textContent = 'Required hours must be at least 1.'; return; }

  const r = await updateStudent(id, {
    start_date:start, end_date:end, required_hours:hours,
    expected_time_in:tin, expected_time_out:tout, break_minutes:brk
  });
  if(!r.ok){ err.textContent = r.error; return; }
  closeModal('editModal'); toast('Schedule updated.','success'); drawRows();
}
async function archive(id){
  const st = window.__DB__.students.find(x=>x.id===id);
  const ok = await confirmDialog({
    title:'Archive intern',
    message:`Archive ${st ? st.name : 'this intern'}? They move to the Archived page and can be restored later.`,
    confirmText:'Archive'
  });
  if(!ok) return;
  const r = await updateStudent(id, { active:false });
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Student archived.','success'); drawRows();
}
async function viewDocs(id){
  const s = window.__DB__.students.find(x=>x.id===id); if(!s) return;
  document.getElementById('d_title').textContent = `Documents — ${s.name} (${s.id})`;
  const body = document.getElementById('d_body');
  const reqs = s.requirements || [];
  if(!reqs.length){ body.innerHTML = '<div class="text-muted">No documents uploaded.</div>'; }
  else {
    body.innerHTML = `<div class="table-wrap"><table class="table">
      <thead><tr><th>File</th><th>Label</th><th>Size</th><th>Uploaded</th><th></th></tr></thead>
      <tbody>${reqs.map(r=>`<tr>
        <td>${r.name}</td><td>${r.label||'—'}</td>
        <td>${humanSize(r.size)}</td><td>${fmtDate(r.uploaded_at)}</td>
        <td><button class="btn btn-outline btn-sm" onclick="openDoc('${r.path}')">Open</button></td>
      </tr>`).join('')}</tbody></table></div>`;
  }
  openModal('docsModal');
}
async function openDoc(path){
  const url = await getRequirementUrl(path);
  if(url) window.open(url,'_blank'); else toast('Cannot open file.','error');
}
function viewProfile(id){
  const s = window.__DB__.students.find(x=>x.id===id); if(!s) return;
  const rendered = totalHours(s.id);
  document.getElementById('p_body').innerHTML = `
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:16px">
      ${profileIconHTML(s, 72)}
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--blue-900)">${s.name}</div>
        <div class="text-muted">${s.id}</div>
        <div class="text-muted text-sm">Diploma in Information Technology</div>
      </div>
    </div>
    <div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><div class="text-muted text-sm">Email</div><div>${s.email||'—'}</div></div>
      <div><div class="text-muted text-sm">Phone</div><div>${s.phone||'—'}</div></div>
      <div><div class="text-muted text-sm">School</div><div>${s.school||'—'}</div></div>
      <div><div class="text-muted text-sm">Course</div><div>${s.course||'—'}</div></div>
      <div><div class="text-muted text-sm">Adviser</div><div>${s.adviser_name||'—'}</div></div>
      <div><div class="text-muted text-sm">Adviser Contact</div><div>${s.adviser_contact||'—'}</div></div>
      <div><div class="text-muted text-sm">OJT Period</div><div>${fmtDate(s.start_date)} – ${fmtDate(s.end_date)}</div></div>
      <div><div class="text-muted text-sm">Shift</div><div>${fmt12(s.expected_time_in)} – ${fmt12(s.expected_time_out)}</div></div>
      <div><div class="text-muted text-sm">Break</div><div>${s.break_minutes||0} minutes</div></div>
      <div><div class="text-muted text-sm">Required Hours</div><div>${s.required_hours}</div></div>
      <div><div class="text-muted text-sm">Rendered Hours</div><div>${rendered}</div></div>
      <div style="grid-column:1/-1"><div class="text-muted text-sm">Address</div><div>${s.address||'—'}</div></div>
    </div>`;
  openModal('profileModal');
}
render();
  subscribeRealtime(() => render());
</script>
</body>
</html>
