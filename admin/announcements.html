<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Announcements — Admin · Naic OJT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
async function render(){
  await requireAdmin();
  const anns = window.__DB__.announcements.slice().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('shell').innerHTML = renderSidebar('admin','announcements') + `
    <main class="main">
      ${renderTopbar('Announcements','Post announcements. They immediately appear for all interns and admins.')}
      <div class="card-grid-2">
        <div class="card">
          <div class="card-head"><div class="card-title">New Announcement</div></div>
          <form onsubmit="post(event)">
            <div class="form-group"><label>Title</label><input class="form-control" id="t" required></div>
            <div class="form-group"><label>Message</label><textarea class="form-control" id="b" rows="5" required></textarea></div>
            <button class="btn btn-primary">Post Announcement</button>
          </form>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Posted (${anns.length})</div></div>
          <div id="annList">
          ${anns.map(a=>`<div class="ann-item">
            <div class="ann-actions">
              <button class="btn btn-outline btn-sm" onclick="edit('${a.id}')">Edit</button>
              <button class="btn btn-outline btn-sm" style="color:#c53030;border-color:#c53030" onclick="del('${a.id}')">Delete</button>
            </div>
            <div style="font-weight:700;color:var(--blue-900)">${escapeHtml(a.title)}</div>
            <div class="text-sm text-muted">${fmtDate(a.date)} · ${escapeHtml(a.author||'Admin')}</div>
            <div class="text-sm mt-2">${escapeHtml(a.body)}</div></div>`).join('') || '<div class="text-muted">No announcements yet.</div>'}
          </div>
        </div>
      </div>
    </main>

    <!-- Single pop-up that edits BOTH the title and the message -->
    <div class="modal" id="editModal">
      <div class="modal-inner" style="max-width:520px">
        <div class="modal-head">
          <h3>Edit Announcement</h3>
          <button class="close-x" onclick="closeModal('editModal')" aria-label="Close dialog">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="e_title">Title</label>
            <input class="form-control" id="e_title" maxlength="120">
          </div>
          <div class="form-group">
            <label for="e_body">Message</label>
            <textarea class="form-control" id="e_body" rows="6"></textarea>
          </div>
          <div class="form-error" id="e_err" role="alert"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
          <button class="btn btn-primary" id="e_save" onclick="saveEdit()">Save Changes</button>
        </div>
      </div>
    </div>`;
  startClock('#clockBox');
}

async function post(e){
  e.preventDefault();
  const title = document.getElementById('t').value.trim();
  const body  = document.getElementById('b').value.trim();
  if(!title || !body) return;
  const r = await addAnnouncement(title, body);
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Announcement posted','success');
  render();
}
let EDIT_ID = null;
function edit(id){
  const a = window.__DB__.announcements.find(x=>x.id===id); if(!a) return;
  EDIT_ID = id;
  document.getElementById('e_title').value = a.title || '';
  document.getElementById('e_body').value  = a.body || '';
  document.getElementById('e_err').textContent = '';
  openModal('editModal');
  setTimeout(()=>document.getElementById('e_title').focus(), 50);
}
async function saveEdit(){
  const title = document.getElementById('e_title').value.trim();
  const body  = document.getElementById('e_body').value.trim();
  const err   = document.getElementById('e_err');
  if(!title){ err.textContent = 'Title is required.'; return; }
  if(!body){ err.textContent = 'Message is required.'; return; }
  const btn = document.getElementById('e_save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const r = await updateAnnouncement(EDIT_ID, { title, body });
  btn.disabled = false; btn.textContent = 'Save Changes';
  if(!r.ok){ err.textContent = r.error; return; }
  closeModal('editModal');
  toast('Announcement updated.','success');
  render();
}
async function del(id){
  const a = window.__DB__.announcements.find(x=>x.id===id);
  const ok = await confirmDelete(`Delete the announcement “${a ? a.title : ''}”? Interns will no longer see it.`, 'Delete announcement');
  if(!ok) return;
  const r = await deleteAnnouncement(id);
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Deleted.','success'); render();
}
render();
  subscribeRealtime(() => render());
</script>
</body></html>
