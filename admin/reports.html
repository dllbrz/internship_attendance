<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account — Admin · Naic OJT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
let CURRENT_ADMIN = null;
let ADMINS = [];
let EDIT_INTERN_ID = null;

async function render(){
  CURRENT_ADMIN = await requireAdmin();
  if(!CURRENT_ADMIN) return;

  document.getElementById('shell').innerHTML = renderSidebar('admin','account') + `
    <main class="main">
      ${renderTopbar('Account Settings','Edit your admin profile, manage administrators, and update intern accounts.')}

      <!-- Admin's own profile -->
      <div class="card">
        <div class="card-head"><div class="card-title">My Admin Profile</div></div>
        <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
          <div class="avatar" style="width:96px;height:96px;font-size:28px;overflow:hidden;border-radius:50%;flex-shrink:0">
            ${CURRENT_ADMIN.avatar ? `<img src="${CURRENT_ADMIN.avatar}" alt="" style="width:100%;height:100%;object-fit:cover">` : (CURRENT_ADMIN.name||'A').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
          </div>
          <div style="flex:1;min-width:240px">
            <div class="form-group"><label>Display Name / Username</label>
              <input class="form-control" id="admName" value="${escapeAttr(CURRENT_ADMIN.name||'')}"></div>
            <div class="text-muted text-sm">Email: <strong>${escapeHtml(CURRENT_ADMIN.email||'')}</strong></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <input type="file" id="admPic" accept="image/*" style="display:none" onchange="admUploadPic(event)">
            <button class="btn btn-outline btn-sm" onclick="document.getElementById('admPic').click()">Upload / Change Photo</button>
            <button class="btn btn-outline btn-sm" style="color:#c53030;border-color:#c53030" onclick="admDelPic()" ${CURRENT_ADMIN.avatar?'':'disabled'}>Delete Photo</button>
            <button class="btn btn-primary btn-sm" onclick="admSaveName()">Save Name</button>
          </div>
        </div>
      </div>

      <div class="card-grid-2">
        <div class="card">
          <div class="card-head"><div class="card-title">Change Password</div></div>
          <form onsubmit="chPass(event)">
            <div class="form-row">
              <div class="form-group"><label>New Password</label><input class="form-control" type="password" id="n1" required minlength="8"></div>
              <div class="form-group"><label>Confirm</label><input class="form-control" type="password" id="n2" required minlength="8"></div>
            </div>
            <p class="text-muted text-sm">Minimum 8 characters. You'll stay signed in.</p>
            <button class="btn btn-primary">Update Password</button>
          </form>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Add Admin</div></div>
          <form onsubmit="addAdmin(event)">
            <div class="form-group"><label>Full Name</label><input class="form-control" id="an" required></div>
            <div class="form-row">
              <div class="form-group"><label>Email</label><input class="form-control" type="email" id="ae" required placeholder="name@naic.gov.ph"></div>
              <div class="form-group"><label>Password</label><input class="form-control" type="password" id="ap" required minlength="8"></div>
            </div>
            <p class="text-muted text-sm">Creates a confirmed account and grants the <code>admin</code> role.</p>
            <button class="btn btn-yellow" id="addAdminBtn">Add Administrator</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Administrators</div>
          <button class="btn btn-ghost btn-sm" onclick="loadAdmins()">Refresh</button>
        </div>
        <div class="table-wrap" id="adminTable"><div class="text-muted p-4">Loading…</div></div>
      </div>

      <!-- Intern account management -->
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">Intern Accounts</div>
          <div class="card-subtitle">Edit intern profile details. Changes save immediately.</div></div>
          <input class="form-control" id="internSearch" placeholder="Search name or ID…" style="max-width:260px" oninput="drawInterns(this.value)">
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>ID</th><th>Name</th><th>School</th><th>Course</th><th>Status</th><th style="text-align:right">Action</th></tr></thead>
          <tbody id="internRows"></tbody>
        </table></div>
      </div>
    </main>

    <!-- Edit intern modal -->
    <div class="modal" id="internModal">
      <div class="modal-inner" style="max-width:640px">
        <div class="modal-head"><h3>Edit Intern Account</h3><button class="close-x" onclick="closeModal('internModal')">×</button></div>
        <div class="modal-body">
          <div id="i_name" style="font-weight:700;color:var(--blue-900);margin-bottom:10px"></div>
          <div class="form-row">
            <div class="form-group"><label>Full Name</label><input class="form-control" id="i_full"></div>
            <div class="form-group"><label>Phone</label><input class="form-control" id="i_phone"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>School</label><input class="form-control" id="i_school"></div>
            <div class="form-group"><label>Course</label><input class="form-control" id="i_course"></div>
          </div>
          <div class="form-group"><label>Address</label><textarea class="form-control" id="i_addr" rows="2"></textarea></div>
          <div class="form-row">
            <div class="form-group"><label>Adviser Name</label><input class="form-control" id="i_adv"></div>
            <div class="form-group"><label>Adviser Contact</label><input class="form-control" id="i_advc"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Start Date</label><input type="date" class="form-control" id="i_start"></div>
            <div class="form-group"><label>End Date</label><input type="date" class="form-control" id="i_end"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Required Hours</label><input type="number" class="form-control" id="i_hours" min="1"></div>
            <div class="form-group"><label>Expected Time In</label><input type="time" class="form-control" id="i_tin"></div>
          </div>
          <div class="form-error" id="i_err"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('internModal')">Cancel</button>
          <button class="btn btn-primary" onclick="saveIntern()">Save Changes</button>
        </div>
      </div>
    </div>`;
  startClock('#clockBox');
  drawInterns('');
  await loadAdmins();
}

async function loadAdmins(){
  const wrap = document.getElementById('adminTable');
  wrap.innerHTML = '<div class="text-muted p-4">Loading…</div>';
  const r = await adminManage('list');
  if(!r.ok){ wrap.innerHTML = `<div class="p-4" style="color:var(--red)">${escapeHtml(r.error)}</div>`; return; }
  ADMINS = r.data.admins || [];
  wrap.innerHTML = `<table>
    <thead><tr><th>Name</th><th>Email</th><th>Created</th><th>Role</th><th style="text-align:right">Action</th></tr></thead>
    <tbody>${ADMINS.map(a=>`
      <tr>
        <td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.email)}</td>
        <td>${new Date(a.created_at).toLocaleDateString()}</td>
        <td><span class="pill blue">Admin</span></td>
        <td style="text-align:right">${a.is_self ? '<span class="text-muted text-sm">You</span>'
          : `<button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="delAdmin('${a.id}','${escapeAttr(a.email)}')">Remove</button>`}</td>
      </tr>`).join('')}</tbody></table>`;
}

function drawInterns(q){
  const search = (q||'').toLowerCase().trim();
  const list = getDB().students.filter(s => !search || s.id.toLowerCase().includes(search) || (s.name||'').toLowerCase().includes(search));
  document.getElementById('internRows').innerHTML = list.length ? list.map(s=>`
    <tr>
      <td style="font-weight:700;color:var(--blue-800)">${s.id}</td>
      <td><div class="cell-name">${profileIconHTML(s,28)}<span class="name-text">${escapeHtml(s.name||'')}</span></div></td>
      <td>${escapeHtml(s.school||'—')}</td>
      <td>${escapeHtml(s.course||'—')}</td>
      <td>${s.active===false?'<span class="pill gray">Archived</span>':'<span class="pill green">Active</span>'}</td>
      <td style="text-align:right"><button class="btn btn-outline btn-sm" onclick="openIntern('${s.id}')">Edit</button></td>
    </tr>`).join('') : '<tr><td colspan="6" class="text-center text-muted" style="padding:16px">No interns found.</td></tr>';
}

function openIntern(id){
  const s = getDB().students.find(x=>x.id===id); if(!s) return;
  EDIT_INTERN_ID = id;
  document.getElementById('i_name').textContent = `${s.name} · ${s.id}`;
  document.getElementById('i_full').value = s.name || '';
  document.getElementById('i_phone').value = s.phone || '';
  document.getElementById('i_school').value = s.school || '';
  document.getElementById('i_course').value = s.course || '';
  document.getElementById('i_addr').value = s.address || '';
  document.getElementById('i_adv').value = s.adviser_name || '';
  document.getElementById('i_advc').value = s.adviser_contact || '';
  document.getElementById('i_start').value = s.start_date || '';
  document.getElementById('i_end').value = s.end_date || '';
  document.getElementById('i_hours').value = s.required_hours || '';
  document.getElementById('i_tin').value = s.expected_time_in || '08:00';
  document.getElementById('i_err').textContent = '';
  openModal('internModal');
}

async function saveIntern(){
  const patch = {
    full_name: document.getElementById('i_full').value.trim(),
    phone: document.getElementById('i_phone').value.trim(),
    school: document.getElementById('i_school').value.trim(),
    course: document.getElementById('i_course').value.trim(),
    address: document.getElementById('i_addr').value.trim(),
    adviser_name: document.getElementById('i_adv').value.trim(),
    adviser_contact: document.getElementById('i_advc').value.trim(),
    start_date: document.getElementById('i_start').value,
    end_date: document.getElementById('i_end').value,
    required_hours: +document.getElementById('i_hours').value,
    expected_time_in: document.getElementById('i_tin').value || '08:00'
  };
  const r = await updateStudent(EDIT_INTERN_ID, patch);
  if(!r.ok){ document.getElementById('i_err').textContent = r.error; return; }
  closeModal('internModal'); toast('Intern updated.','success');
  drawInterns(document.getElementById('internSearch').value);
}

async function chPass(e){
  e.preventDefault();
  if(n1.value !== n2.value){ toast('Passwords do not match','error'); return; }
  const r = await updateCurrentPassword(n1.value);
  if(!r.ok){ toast(r.error,'error'); return; }
  n1.value = ''; n2.value = '';
  toast('Password changed','success');
}

async function addAdmin(e){
  e.preventDefault();
  const btn = document.getElementById('addAdminBtn');
  btn.disabled = true; btn.textContent = 'Adding…';
  const r = await adminManage('create', { full_name: an.value.trim(), email: ae.value.trim(), password: ap.value });
  btn.disabled = false; btn.textContent = 'Add Administrator';
  if(!r.ok){ toast(r.error,'error'); return; }
  an.value = ''; ae.value = ''; ap.value = '';
  toast('Administrator added','success');
  await loadAdmins();
}

async function delAdmin(userId, email){
  if(!confirm(`Delete admin ${email}? This removes their account permanently.`)) return;
  const r = await adminManage('delete', { user_id: userId });
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Administrator removed','success');
  await loadAdmins();
}

async function admSaveName(){
  const name = document.getElementById('admName').value.trim();
  if(!name){ toast('Name cannot be empty','error'); return; }
  const r = await updateAdminSelf({ full_name:name });
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Profile updated','success'); render();
}
async function admUploadPic(e){
  const f = e.target.files[0]; if(!f) return;
  toast('Uploading…','info');
  const r = await uploadAdminAvatar(f);
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Photo updated','success'); render();
}
async function admDelPic(){
  if(!confirm('Remove your profile photo?')) return;
  const r = await deleteAdminAvatar();
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Photo removed','success'); render();
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

render();
</script>
</body>
</html>
