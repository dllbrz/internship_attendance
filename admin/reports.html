<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports — Admin · Naic OJT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script>
let TREND_CHART = null;

function isoDaysAgo(n){
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.toISOString().slice(0,10);
}

async function render(){
  const admin = await requireAdmin(); if(!admin) return;
  const students = window.__DB__.students;

  document.getElementById('shell').innerHTML = renderSidebar('admin','reports') + `
    <main class="main">
      ${renderTopbar('Reports','Attendance analytics across all interns. Filter, then export to CSV, PDF, or print.')}

      <div class="card">
        <div class="card-title" style="margin-bottom:8px">Filters</div>
        <div class="scanner-settings" role="group" aria-label="Report filters">
          <div class="form-group">
            <label for="f_from">From</label>
            <input type="date" class="form-control" id="f_from" value="${isoDaysAgo(29)}">
          </div>
          <div class="form-group">
            <label for="f_to">To</label>
            <input type="date" class="form-control" id="f_to" value="${todayStr()}">
          </div>
          <div class="form-group">
            <label for="f_student">Intern</label>
            <select class="form-control" id="f_student">
              <option value="">All interns</option>
              ${students.map(s=>`<option value="${s.id}">${s.id} — ${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label for="f_status">Status</label>
            <select class="form-control" id="f_status">
              <option value="">All statuses</option>
              <option value="present">Present</option>
              <option value="late">Late</option>
              <option value="absent">Absent</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
          <button class="btn btn-outline" onclick="resetFilters()">Reset</button>
        </div>
      </div>

      <div class="stat-grid" id="stats"></div>

      <div class="card">
        <div class="card-head"><div class="card-title">Attendance Trend</div></div>
        <canvas id="trend" height="90"></canvas>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Attendance Records</div>
          <div class="flex gap-2">
            <button class="btn btn-outline btn-sm" onclick="csv()">Export CSV</button>
            <button class="btn btn-primary btn-sm" onclick="pdf()">Export PDF</button>
            <button class="btn btn-yellow btn-sm" onclick="prn()">Print</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="table" id="tbl">
            <thead><tr><th>Date</th><th>Intern ID</th><th>Name</th><th>Time In</th><th>Time Out</th><th>Hours</th><th>Status</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="card-title">Per-Intern Summary</div></div>
        <div class="table-wrap">
          <table class="table" id="sumTbl">
            <thead><tr><th>Intern ID</th><th>Name</th><th>Present</th><th>Late</th><th>Absent</th><th>Hours Rendered</th><th>Required</th><th>Progress</th></tr></thead>
            <tbody id="sumRows"></tbody>
          </table>
        </div>
      </div>
    </main>`;

  startClock('#clockBox');
  applyFilters();
}

function currentFilters(){
  return {
    from: document.getElementById('f_from').value,
    to: document.getElementById('f_to').value,
    student: document.getElementById('f_student').value,
    status: document.getElementById('f_status').value,
  };
}

function filteredRecords(){
  const f = currentFilters();
  return window.__DB__.attendance.filter(a=>{
    if(f.from && a.date < f.from) return false;
    if(f.to && a.date > f.to) return false;
    if(f.student && a.student_id !== f.student) return false;
    if(f.status && a.status !== f.status) return false;
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date) || String(a.student_id).localeCompare(String(b.student_id)));
}

function nameOf(internId){
  const s = window.__DB__.students.find(x=>x.id===internId);
  return s ? s.name : '—';
}

function resetFilters(){
  document.getElementById('f_from').value = isoDaysAgo(29);
  document.getElementById('f_to').value = todayStr();
  document.getElementById('f_student').value = '';
  document.getElementById('f_status').value = '';
  applyFilters();
}

function applyFilters(){
  const list = filteredRecords();
  const present = list.filter(r=>r.status==='present').length;
  const late = list.filter(r=>r.status==='late').length;
  const absent = list.filter(r=>r.status==='absent').length;
  const hours = +list.reduce((s,r)=>s+(r.hours||0),0).toFixed(2);

  document.getElementById('stats').innerHTML = `
    <div class="stat-card green"><div><div class="stat-label">Present</div><div class="stat-value">${present}</div></div><div class="stat-icon">${STAT_ICONS.present}</div></div>
    <div class="stat-card yellow"><div><div class="stat-label">Late</div><div class="stat-value">${late}</div></div><div class="stat-icon">${STAT_ICONS.late}</div></div>
    <div class="stat-card red"><div><div class="stat-label">Absent</div><div class="stat-value">${absent}</div></div><div class="stat-icon">${STAT_ICONS.absent}</div></div>
    <div class="stat-card"><div><div class="stat-label">Hours Rendered</div><div class="stat-value">${hours}</div><div class="stat-meta">${list.length} record(s)</div></div><div class="stat-icon">${STAT_ICONS.hours}</div></div>`;

  document.getElementById('rows').innerHTML = list.map(r=>`
    <tr>
      <td>${fmtDate(r.date)}</td>
      <td style="font-weight:700;color:var(--blue-800)">${r.student_id}</td>
      <td>${nameOf(r.student_id)}</td>
      <td>${fmt12(r.time_in)}</td>
      <td>${fmt12(r.time_out)}</td>
      <td>${r.hours || '—'}</td>
      <td><span class="badge badge-${r.status}">${r.status.charAt(0).toUpperCase()+r.status.slice(1)}</span></td>
    </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:#888;padding:16px">No records match the selected filters.</td></tr>';

  drawSummary(list);
  drawTrend(list);
}

function drawSummary(list){
  const f = currentFilters();
  const students = window.__DB__.students.filter(s=> !f.student || s.id === f.student);
  document.getElementById('sumRows').innerHTML = students.map(s=>{
    const recs = list.filter(r=>r.student_id===s.id);
    const p = recs.filter(r=>r.status==='present').length;
    const l = recs.filter(r=>r.status==='late').length;
    const a = recs.filter(r=>r.status==='absent').length;
    const done = totalHours(s.id);
    const pct = s.required_hours ? Math.min(100, (done/s.required_hours)*100).toFixed(0) : '0';
    return `<tr>
      <td style="font-weight:700;color:var(--blue-800)">${s.id}</td>
      <td>${s.name}</td><td>${p}</td><td>${l}</td><td>${a}</td>
      <td>${done}</td><td>${s.required_hours}</td>
      <td style="min-width:120px">
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
        <span class="text-sm text-muted">${pct}%</span>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" style="text-align:center;color:#888;padding:16px">No interns to summarize.</td></tr>';
}

function drawTrend(list){
  const byDate = {};
  list.forEach(r=>{
    byDate[r.date] = byDate[r.date] || { present:0, late:0, absent:0 };
    byDate[r.date][r.status] = (byDate[r.date][r.status] || 0) + 1;
  });
  const labels = Object.keys(byDate).sort();
  const canvas = document.getElementById('trend');
  if(!canvas || typeof Chart === 'undefined') return;
  if(TREND_CHART) TREND_CHART.destroy();
  TREND_CHART = new Chart(canvas, {
    type:'line',
    data:{ labels: labels.map(d=>d.slice(5)), datasets:[
      { label:'Present', data:labels.map(d=>byDate[d].present||0), borderColor:'#22c55e', backgroundColor:'rgba(34,197,94,.15)', tension:.3, fill:true },
      { label:'Late', data:labels.map(d=>byDate[d].late||0), borderColor:'#fdc22b', backgroundColor:'rgba(253,194,43,.15)', tension:.3, fill:true },
      { label:'Absent', data:labels.map(d=>byDate[d].absent||0), borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.12)', tension:.3, fill:true }
    ]},
    options:{ responsive:true, plugins:{ legend:{ position:'bottom' } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
  });
}

function reportTitle(){
  const f = currentFilters();
  const who = f.student ? `${f.student} — ${nameOf(f.student)}` : 'All Interns';
  return `Attendance Report (${who}) ${fmtDate(f.from)} – ${fmtDate(f.to)}`;
}

function csv(){
  const rows = [['Date','Intern ID','Name','Time In','Time Out','Hours','Status']];
  filteredRecords().forEach(r=>rows.push([fmtDate(r.date), r.student_id, nameOf(r.student_id), fmt12(r.time_in), fmt12(r.time_out), r.hours||0, r.status]));
  exportCSV('attendance-report.csv', rows);
}
function pdf(){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('PDF library still loading. Try again.','error'); return; }
  const rows = filteredRecords().map(r=>[fmtDate(r.date), r.student_id, nameOf(r.student_id), fmt12(r.time_in), fmt12(r.time_out), String(r.hours||'—'), r.status.toUpperCase()]);
  exportPDF('attendance-report.pdf', reportTitle(), ['Date','Intern ID','Name','Time In','Time Out','Hours','Status'], rows);
}
function prn(){
  printReport(reportTitle(), document.getElementById('tbl').outerHTML);
}

render();
</script>
</body>
</html>
