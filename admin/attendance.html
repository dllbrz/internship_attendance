<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance — Admin · Naic OJT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
let CURRENT_TAB = 'all';
let SEARCH = '';
let CURRENT_DATE = todayStr();
let REFRESH_TIMER = null;
let DAY_ROWS = [];       // records that ACTUALLY exist for CURRENT_DATE
let EDIT_RECORD_ID = null;

async function render(){
  const admin = await requireAdmin(); if(!admin) return;
  document.getElementById('shell').innerHTML = renderSidebar('admin','attendance') + `
    <main class="main">
      ${renderTopbar('Attendance', "Records for the selected date only. Late/Absent thresholds follow the Scanner schedule.",
        `<button class="btn btn-outline" onclick="refreshData()">Refresh</button>
         <button class="btn btn-primary" onclick="openSchedule()">+ Add Schedule</button>
         <a class="btn-icon" href="archived.html#attendance" title="Open deleted records archive" aria-label="Open deleted records archive">${ICONS.file}</a>
         <button class="btn btn-outline" style="color:#c53030;border-color:#c53030" onclick="deleteForDate()">Delete all for this date</button>`)}

      <div class="card">
        <div class="filter-row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
          <label class="text-sm" for="dateFilter" style="min-width:auto">Date:</label>
          <input type="date" class="form-control" id="dateFilter" value="${CURRENT_DATE}" style="max-width:180px" onchange="changeDate(this.value)">
          <button class="btn btn-outline btn-sm" onclick="changeDate(todayStr())">Today</button>
          <label class="sr-only" for="search">Search interns</label>
          <input type="text" class="form-control" id="search" placeholder="Search name or ID…" style="flex:1;min-width:200px" oninput="onSearch(this.value)">
        </div>

        <div class="text-sm text-muted" id="dateSummary" aria-live="polite" style="margin-bottom:10px"></div>

        <div class="status-tabs">
          <button class="status-tab active" data-tab="all"    onclick="switchTab('all')">All <span class="count" id="cnt-all">0</span></button>
          <button class="status-tab"        data-tab="present" onclick="switchTab('present')">Present <span class="count" id="cnt-present">0</span></button>
          <button class="status-tab"        data-tab="late"    onclick="switchTab('late')">Late <span class="count" id="cnt-late">0</span></button>
          <button class="status-tab"        data-tab="absent"  onclick="switchTab('absent')">Absent <span class="count" id="cnt-absent">0</span></button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th scope="col">Intern ID</th><th scope="col">Name</th>
              <th scope="col">Time In</th><th scope="col">Time Out</th>
              <th scope="col">Status</th><th scope="col">Hours</th>
              <th scope="col" style="text-align:right">Actions</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Manual record modification -->
    <div class="modal" id="recModal">
      <div class="modal-inner" style="max-width:480px">
        <div class="modal-head">
          <h3>Edit Attendance Record</h3>
          <button class="close-x" onclick="closeModal('recModal')" aria-label="Close dialog">×</button>
        </div>
        <div class="modal-body">
          <div id="r_who" style="font-weight:700;color:var(--blue-900);margin-bottom:4px"></div>
          <div class="text-muted text-sm" id="r_date" style="margin-bottom:14px"></div>
          <div class="form-row">
            <div class="form-group"><label for="r_in">Time In</label>
              <input type="time" class="form-control" id="r_in">
              <div class="form-control blank-time" id="r_in_blank" style="display:none">--:-- --</div></div>
            <div class="form-group"><label for="r_out">Time Out</label>
              <input type="time" class="form-control" id="r_out">
              <div class="form-control blank-time" id="r_out_blank" style="display:none">--:-- --</div></div>
          </div>
          <div class="form-group">
            <label for="r_status">Status</label>
            <select class="form-control" id="r_status" onchange="onRecStatus()">
              <option value="present">Present</option>
              <option value="late">Late</option>
              <option value="absent">Absent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="r_note">Reason / note (visible to the intern)</label>
            <input type="text" class="form-control" id="r_note" maxlength="160"
                   placeholder="e.g. Did not report for duty — no hours credited"
                   aria-describedby="r_noteHint">
            <p class="text-sm text-muted" id="r_noteHint" style="margin-top:4px">
              Shown to the intern beside this day in their attendance history. Leave blank to remove the note.
            </p>
          </div>
          <p class="text-sm text-muted" id="r_hint" aria-live="polite"></p>
          <div class="form-error" id="r_err" role="alert"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('recModal')">Cancel</button>
          <button class="btn btn-primary" id="r_save" onclick="saveRecord()">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- Add a scheduled / credited day for a selected intern -->
    <div class="modal" id="schedModal">
      <div class="modal-inner" style="max-width:520px">
        <div class="modal-head">
          <h3>Add Schedule for an Intern</h3>
          <button class="close-x" onclick="closeModal('schedModal')" aria-label="Close dialog">×</button>
        </div>
        <div class="modal-body">
          <p class="text-sm text-muted" style="margin-bottom:14px">
            Use this to record a <strong>Regular day</strong> that was not scanned (for example
            when attendance could not be checked), or to grant a rest day, reward, holiday or
            off-site day. The intern does not need to scan — the hours below are still credited
            and the day shows as attended for both the admin and the intern.
            Choose <strong>Excused (Not Credited)</strong>, <strong>Absent</strong> or
            <strong>Suspension of work</strong> to record a
            day with no rendered hours: time in / time out are left blank and the day counts as
            an absence everywhere.
          </p>
          <div class="form-group">
            <label for="s_student">Intern</label>
            <select class="form-control" id="s_student" onchange="onSchedStudent()"></select>
          </div>
          <div class="form-group">
            <label for="s_type">Schedule type</label>
            <select class="form-control" id="s_type" onchange="onSchedType()"></select>
          </div>
          <div class="form-group">
            <label for="s_status">Attendance status</label>
            <select class="form-control" id="s_status" onchange="onSchedStatus()"
                    aria-describedby="s_statusHint"></select>
            <p class="text-sm text-muted" id="s_statusHint" style="margin-top:4px">
              Pick the status shown to the admin and the intern for this day. It can be
              set for any schedule type. <strong>Absent</strong> always saves the day with
              no time in / time out and 0 credited hours.
            </p>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="s_date">Date</label>
              <input type="date" class="form-control" id="s_date"></div>
            <div class="form-group"><label for="s_hours">Credited hours</label>
              <input type="number" class="form-control" id="s_hours" min="0" max="24" step="0.25"></div>
          </div>
          <div class="form-group" id="s_otherRow" style="display:none">
            <label for="s_other">Other: specify the type of schedule <span aria-hidden="true">*</span></label>
            <input type="text" class="form-control" id="s_other" maxlength="60"
                   placeholder="e.g. Seminar, Team building, Suspension of work"
                   aria-describedby="s_otherHint">
            <p class="text-sm text-muted" id="s_otherHint" style="margin-top:4px">
              This exact wording is saved with the day and is visible to the intern.
            </p>
          </div>
          <div class="form-row" id="s_timeRow">
            <div class="form-group"><label for="s_tin">Time in</label>
              <input type="time" class="form-control" id="s_tin" onchange="recalcSchedHours()">
              <div class="form-control blank-time" id="s_tin_blank" style="display:none">--:-- --</div></div>
            <div class="form-group"><label for="s_tout">Time out</label>
              <input type="time" class="form-control" id="s_tout" onchange="recalcSchedHours()">
              <div class="form-control blank-time" id="s_tout_blank" style="display:none">--:-- --</div></div>
          </div>
          <div class="form-group">
            <label for="s_note">Reason / note (visible to the intern)</label>
            <input type="text" class="form-control" id="s_note" maxlength="160" placeholder="e.g. Reward rest day for outstanding performance">
          </div>
          <p class="text-sm text-muted" id="s_hint" aria-live="polite"></p>
          <div class="form-error" id="s_err" role="alert"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('schedModal')">Cancel</button>
          <button class="btn btn-primary" id="s_save" onclick="saveSchedule()">Save Schedule</button>
        </div>
      </div>
    </div>`;
  startClock('#clockBox');
  await loadDate();
  if(REFRESH_TIMER) clearInterval(REFRESH_TIMER);
  REFRESH_TIMER = setInterval(refreshData, 30000);
}

async function changeDate(d){
  if(!d) return;
  CURRENT_DATE = d;
  const picker = document.getElementById('dateFilter');
  if(picker && picker.value !== d) picker.value = d;
  await loadDate();
}
function onSearch(v){ SEARCH = v.toLowerCase().trim(); drawRows(); }
function switchTab(tab){
  CURRENT_TAB = tab;
  document.querySelectorAll('.status-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  drawRows();
}

/* Fetch the records that EXIST for the chosen date. Interns without a record
   that day are intentionally NOT listed — the table reflects real detected
   records only. */
async function loadDate(){
  const rows = document.getElementById('rows');
  if(rows) rows.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888;padding:20px">Loading records…</td></tr>';
  if(CURRENT_DATE === todayStr()) await autoMarkAbsent();
  const r = await fetchAttendanceForDate(CURRENT_DATE);
  if(!r.ok){ toast(r.error,'error'); DAY_ROWS = []; }
  else DAY_ROWS = r.rows;
  drawRows();
}
async function refreshData(){ await loadDate(); }

function decorate(rec){
  const s = window.__DB__.students.find(x=>x.id===rec.student_id);
  return {
    ...rec,
    name: s ? s.name : rec.student_id,
    avatar: s ? s.avatar : null,
    archived: s ? s.active === false : false
  };
}

function drawRows(){
  const all = DAY_ROWS.map(decorate).filter(r=>
    !SEARCH || String(r.student_id).toLowerCase().includes(SEARCH) || String(r.name).toLowerCase().includes(SEARCH)
  ).sort((a,b)=> (b.time_in||'').localeCompare(a.time_in||'') || String(a.name).localeCompare(String(b.name)));

  const counts = { all: all.length, present:0, late:0, absent:0 };
  all.forEach(r=>{ r._disp = attendanceDisplay(r); counts[r._disp.key]++; });
  document.getElementById('cnt-all').textContent = counts.all;
  document.getElementById('cnt-present').textContent = counts.present;
  document.getElementById('cnt-late').textContent = counts.late;
  document.getElementById('cnt-absent').textContent = counts.absent;

  const summary = document.getElementById('dateSummary');
  summary.textContent = DAY_ROWS.length
    ? `${DAY_ROWS.length} attendance record${DAY_ROWS.length===1?'':'s'} detected for ${fmtDate(CURRENT_DATE)}.`
    : `No attendance records were recorded on ${fmtDate(CURRENT_DATE)}.`;

  const filtered = CURRENT_TAB==='all' ? all : all.filter(r=>r._disp.key===CURRENT_TAB);
  const rows = document.getElementById('rows');

  if(!DAY_ROWS.length){
    rows.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#888;padding:26px">
      No records found for <strong>${fmtDate(CURRENT_DATE)}</strong>. Pick another date.</td></tr>`;
    return;
  }

  rows.innerHTML = filtered.map(r=>`
    <tr>
      <td style="font-weight:700;color:var(--blue-800)">${escapeHtml(r.student_id)}</td>
      <td><div class="cell-name">${profileIconHTML(r,30)}<span class="name-text">${escapeHtml(r.name)}</span>${r.archived?' <span class="pill gray">Archived</span>':''}</div></td>
      <td>${fmt12(r.time_in)}</td>
      <td>${fmt12(r.time_out)}</td>
      <td><span class="badge badge-${r._disp.key}">${r._disp.label}</span>${r.credit_type?`<div class="text-sm text-muted" style="margin-top:4px">${isAbsentCreditType(r.credit_type)?'No hours credited':(r.credit_type==='regular'?'Recorded manually':'Credited')}${r.note?': '+escapeHtml(r.note):''}</div>`:''}</td>
      <td>${Number(r.hours||0).toFixed(2)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn-icon" onclick="openRecord('${r.id}')" title="Edit record" aria-label="Edit record for ${escapeAttr(r.name)}">${ICONS.edit}</button>
        <button class="btn-icon danger" onclick="delRecord('${r.id}')" title="Delete record" aria-label="Delete record for ${escapeAttr(r.name)}">${ICONS.trash}</button>
      </td>
    </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:#888;padding:20px">No ${CURRENT_TAB} records for ${fmtDate(CURRENT_DATE)}.</td></tr>`;
}

/* Swaps a <input type="time"> for a read-only "--:-- --" display (and back). */
function showBlankTime(baseId, blank){
  const input = document.getElementById(baseId);
  const ph    = document.getElementById(baseId + '_blank');
  if(!input || !ph) return;
  input.style.display = blank ? 'none' : '';
  ph.style.display    = blank ? '' : 'none';
}

/* ---------- manual modification ---------- */
function openRecord(id){
  const rec = DAY_ROWS.find(r=>r.id===id); if(!rec) return;
  const r = decorate(rec);
  EDIT_RECORD_ID = id;
  document.getElementById('r_who').textContent = `${r.name} · ${r.student_id}`;
  document.getElementById('r_date').textContent = fmtDate(r.date);
  document.getElementById('r_in').value = r.time_in || '';
  document.getElementById('r_out').value = r.time_out || '';
  // The displayed status is what the admin sees in the table, so the dropdown
  // opens on the SAME value (a manual "Present (manual)" day opens on Present,
  // an absence opens on Absent) instead of the raw stored status.
  const shown = (typeof attendanceDisplay === 'function')
    ? attendanceDisplay(rec, null, {admin:true}).key : (r.status || 'absent');
  document.getElementById('r_status').value = (shown === 'late' ? 'late' : shown === 'absent' ? 'absent' : 'present');
  document.getElementById('r_note').value = rec.note || '';
  document.getElementById('r_err').textContent = '';
  onRecStatus();
  openModal('recModal');
}

// Absent = no rendered hours: the time fields are cleared and locked so the
// saved record can never keep a time in / time out (which used to make the day
// come back as "Present (manual)").
function onRecStatus(){
  const status = document.getElementById('r_status').value;
  const tin  = document.getElementById('r_in');
  const tout = document.getElementById('r_out');
  const hint = document.getElementById('r_hint');
  const absent = (status === 'absent');
  if(absent){ tin.value = ''; tout.value = ''; }
  tin.disabled = absent; tout.disabled = absent;
  // An absence never has real times: the inputs are swapped for a read-only
  // "--:-- --" display so the admin sees exactly what the intern will see.
  showBlankTime('r_in', absent);
  showBlankTime('r_out', absent);
  hint.textContent = absent
    ? 'Absent: time in / time out are cleared and 0 hours are credited for this day. The intern sees this day as Absent.'
    : 'Hours are recalculated automatically from time in/out minus the intern\u2019s break.';
}

async function saveRecord(){
  const err  = document.getElementById('r_err');
  const status = document.getElementById('r_status').value;
  const absent = (status === 'absent');
  const tin  = absent ? '' : document.getElementById('r_in').value;
  const tout = absent ? '' : document.getElementById('r_out').value;

  if(tout && !tin){ err.textContent = 'A time out needs a time in.'; return; }
  if(tin && tout && tout <= tin){ err.textContent = 'Time out must be later than time in.'; return; }
  if(!absent && !tin){ err.textContent = 'Present/Late records need a time in.'; return; }

  const btn = document.getElementById('r_save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const note = document.getElementById('r_note').value.trim();
  const patch = { time_in:tin, time_out:tout, status, verified:true, note };
  if(absent) patch.hours = 0;
  const r = await updateAttendanceRecord(EDIT_RECORD_ID, patch);
  btn.disabled = false; btn.textContent = 'Save Changes';
  if(!r.ok){ err.textContent = r.error; return; }

  const i = DAY_ROWS.findIndex(x=>x.id===EDIT_RECORD_ID);
  if(i>=0) DAY_ROWS[i] = r.record;
  closeModal('recModal');
  toast(absent ? 'Marked as Absent.' : 'Record updated.','success');
  await loadDate();
}

/* ---------- deletion (soft delete → Archive) ---------- */
/* ---------- add schedule / credited day ---------- */
function openSchedule(){
  const actives = (window.__DB__.students||[]).filter(s=>s.active !== false)
    .sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  if(!actives.length){ toast('No active interns to schedule.','info'); return; }

  document.getElementById('s_student').innerHTML =
    actives.map(s=>`<option value="${escapeAttr(s.id)}">${escapeHtml(s.name)} — ${escapeHtml(s.id)}</option>`).join('');
  document.getElementById('s_type').innerHTML =
    CREDIT_TYPES.map(t=>`<option value="${t.value}">${t.label}</option>`).join('');
  document.getElementById('s_status').innerHTML =
    SCHEDULE_STATUSES.map(t=>`<option value="${t.value}">${t.label}</option>`).join('');
  document.getElementById('s_date').value = CURRENT_DATE || todayStr();
  document.getElementById('s_note').value = '';
  document.getElementById('s_other').value = '';
  document.getElementById('s_err').textContent = '';
  onSchedStudent();
  onSchedType();
  openModal('schedModal');
}

function onSchedStudent(){
  const id = document.getElementById('s_student').value;
  const s  = (window.__DB__.students||[]).find(x=>x.id===id);
  const sch = (typeof getOfficeSchedule === 'function' ? getOfficeSchedule() : {}) || {};
  document.getElementById('s_hours').value = defaultCreditHours(s);
  document.getElementById('s_tin').value  = (s && s.expected_time_in)  || sch.start_time || '08:00';
  document.getElementById('s_tout').value = (s && s.expected_time_out) || sch.end_time   || '17:00';
  document.getElementById('s_hint').textContent = s
    ? `Default credit follows ${s.name}'s shift (${fmt12(s.expected_time_in)} – ${fmt12(s.expected_time_out)} minus break). You can change it.`
    : '';
}

// "Regular day" = the intern actually reported for duty but nobody scanned,
// so the admin types the real time in / time out and the hours follow them.
// The status dropdown is independent of the schedule type, but choosing an
// absence schedule type pre-selects the matching status for convenience.
function onSchedStatus(){
  const statusEl = document.getElementById('s_status');
  if(!statusEl) return;
  const status  = statusEl.value;
  const isAbsentStatus = (status === 'absent');
  const type = document.getElementById('s_type').value;
  const isAbsence = ((typeof isAbsentCreditType === 'function') && isAbsentCreditType(type)) || isAbsentStatus;
  const row = document.getElementById('s_timeRow');
  const isRegular = (type === 'regular');
  row.style.display = (isRegular || isAbsence) ? '' : 'none';
  showBlankTime('s_tin', isAbsence);
  showBlankTime('s_tout', isAbsence);
  const hoursEl = document.getElementById('s_hours');
  const hoursGroup = hoursEl ? hoursEl.closest('.form-group') : null;
  if(isAbsence){
    document.getElementById('s_tin').value = '';
    document.getElementById('s_tout').value = '';
    hoursEl.value = '0.00';
    hoursEl.readOnly = true;
    hoursEl.setAttribute('aria-readonly','true');
    if(hoursGroup) hoursGroup.style.display = 'none';
  } else {
    hoursEl.readOnly = false;
    hoursEl.removeAttribute('aria-readonly');
    if(hoursGroup) hoursGroup.style.display = '';
    if(!hoursEl.value || Number(hoursEl.value) === 0) onSchedStudentHint();
  }
}

function onSchedType(){
  const type = document.getElementById('s_type').value;
  // Pre-select the status that matches the chosen schedule type. The admin can
  // still change it to anything afterwards.
  const statusEl = document.getElementById('s_status');
  if(statusEl){
    const absenceType = (typeof isAbsentCreditType === 'function') && isAbsentCreditType(type);
    statusEl.value = absenceType ? 'absent'
      : (type === 'excused' ? 'excused'
        : (type === 'regular' || type === 'makeup' || type === 'offsite' ? 'present' : 'credited'));
  }
  const row  = document.getElementById('s_timeRow');
  const isRegular = (type === 'regular');
  const isAbsence = (typeof isAbsentCreditType === 'function') && isAbsentCreditType(type);
  // Absences (Absent / Excused-not-credited / Suspension) still SHOW the time
  // fields, but as a read-only "--:-- --" so it is obvious that no time in /
  // time out is recorded for the day. Crediting types keep hiding the row.
  row.style.display = (isRegular || isAbsence) ? '' : 'none';
  showBlankTime('s_tin', isAbsence);
  showBlankTime('s_tout', isAbsence);
  if(isAbsence){
    document.getElementById('s_tin').value = '';
    document.getElementById('s_tout').value = '';
  }
  const otherRow = document.getElementById('s_otherRow');
  if(otherRow) otherRow.style.display = (type === 'other') ? '' : 'none';
  const note = document.getElementById('s_note');
  note.placeholder = isAbsence
    ? (type === 'suspension'
        ? 'e.g. Suspension of work — Typhoon Signal No. 2'
        : 'e.g. Did not report for duty — no hours credited')
    : (isRegular
        ? 'e.g. Attendance was not scanned — recorded manually by the admin'
        : 'e.g. Reward rest day for outstanding performance');

  // An absence type never has time in / time out and never credits hours.
  const hoursEl = document.getElementById('s_hours');
  const hoursGroup = hoursEl ? hoursEl.closest('.form-group') : null;
  if(isAbsence){
    hoursEl.value = '0.00';
    hoursEl.readOnly = true;
    hoursEl.setAttribute('aria-readonly','true');
    // No hours can ever be credited for an absence, so the field is hidden.
    if(hoursGroup) hoursGroup.style.display = 'none';
    document.getElementById('s_hint').textContent =
      type === 'excused_uncredited'
        ? 'Excused (Not Credited): the reason is recorded and visible to the intern, but the day counts as Absent with 0 hours and no time in / time out.'
        : (type === 'suspension'
            ? 'Suspension of Work: the day is recorded with 0 hours and no time in / time out (--:-- --). The reason below is visible to the intern.'
            : 'Absent: the day is marked Absent with 0 hours and no time in / time out (--:-- --).');
  } else {
    hoursEl.readOnly = false;
    hoursEl.removeAttribute('aria-readonly');
    if(hoursGroup) hoursGroup.style.display = '';
    if(isRegular) recalcSchedHours();
    else onSchedStudentHint();
  }
  onSchedStatus();
}

// Restores the default credited hours + shift hint for a crediting type.
function onSchedStudentHint(){
  const id = document.getElementById('s_student').value;
  const s  = (window.__DB__.students||[]).find(x=>x.id===id);
  const hoursEl = document.getElementById('s_hours');
  if(s && (!hoursEl.value || Number(hoursEl.value) === 0)) hoursEl.value = defaultCreditHours(s);
  document.getElementById('s_hint').textContent = s
    ? `Default credit follows ${s.name}'s shift (${fmt12(s.expected_time_in)} – ${fmt12(s.expected_time_out)} minus break). You can change it.`
    : '';
}

// Recompute credited hours from the typed times (minus the intern's break).
function recalcSchedHours(){
  const tin  = document.getElementById('s_tin').value;
  const tout = document.getElementById('s_tout').value;
  if(!tin || !tout || tout <= tin) return;
  const id = document.getElementById('s_student').value;
  const s  = (window.__DB__.students||[]).find(x=>x.id===id);
  const toM = t => (+t.slice(0,2))*60 + (+t.slice(3,5));
  const brk = (typeof breakMinutesFor === 'function') ? breakMinutesFor(s) : 0;
  document.getElementById('s_hours').value =
    Math.max(0, (toM(tout) - toM(tin) - brk) / 60).toFixed(2);
}

async function saveSchedule(){
  const err = document.getElementById('s_err');
  err.textContent = '';
  const id    = document.getElementById('s_student').value;
  const date  = document.getElementById('s_date').value;
  const hours = document.getElementById('s_hours').value;
  const type  = document.getElementById('s_type').value;
  const status = document.getElementById('s_status').value;
  let   note  = document.getElementById('s_note').value;
  if(!date){ err.textContent = 'Pick the date of the schedule.'; return; }
  if(type === 'other'){
    const other = document.getElementById('s_other');
    const label = (other.value || '').trim();
    if(!label){
      err.textContent = 'Type the exact schedule reason in the "Other" field.';
      other.focus();
      return;
    }
    // The typed type leads the note so it shows everywhere the day is displayed.
    note = note.trim() ? `${label} — ${note.trim()}` : label;
  }
  const tin  = document.getElementById('s_tin').value;
  const tout = document.getElementById('s_tout').value;
  const isAbsence = ((typeof isAbsentCreditType === 'function') && isAbsentCreditType(type)) || status === 'absent';
  if(type === 'regular' && !isAbsence){
    if(!tin || !tout){ err.textContent = 'Enter the time in and time out for the regular day.'; return; }
    if(tout <= tin){ err.textContent = 'Time out must be later than time in.'; return; }
  }

  const existing = (window.__DB__.attendance||[]).find(a=>a.student_id===id && a.date===date && !a.credit_type && a.time_in);
  if(existing){
    const ok = await confirmDelete(
      `${id} already has a scanned record on ${fmtDate(date)}. Replacing it with a credited schedule will overwrite the scanned times. Continue?`,
      'Replace existing record'
    );
    if(!ok) return;
  }

  const btn = document.getElementById('s_save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const r = await addScheduledCredit(id, isAbsence
    ? { date, credit_type:type, hours:0, note, status:'absent' }
    : { date, credit_type:type, hours, note, status,
        time_in:tin || undefined, time_out:tout || undefined });
  btn.disabled = false; btn.textContent = 'Save Schedule';
  if(!r.ok){ err.textContent = r.error; return; }

  closeModal('schedModal');
  // Keep the specific schedule type (Holiday, Suspension of Work, ...) in the
  // confirmation instead of collapsing every uncredited day to plain "Absent".
  const savedLabel = isAbsence
    ? (type === 'other' ? note.split(' — ')[0] : (CREDIT_LABELS[type] || 'Absent'))
    : ((SCHEDULE_STATUS_LABELS[status] || 'Present') + ' — ' +
       (type === 'other' ? note.split(' — ')[0] : CREDIT_LABELS[type]));
  toast(`${savedLabel} saved for ${r.student.name} on ${fmtDate(date)}.`,'success');
  await changeDate(date);
}

async function delRecord(id){
  const rec = DAY_ROWS.find(r=>r.id===id); if(!rec) return;
  const r = decorate(rec);
  const ok = await confirmDelete(
    `Delete the ${fmtDate(r.date)} record for ${r.name} (${r.student_id})? You can restore it from the Archived page.`,
    'Delete attendance record'
  );
  if(!ok) return;

  // Optimistic removal so the row disappears immediately.
  DAY_ROWS = DAY_ROWS.filter(x=>x.id!==id);
  drawRows();

  const res = await softDeleteAttendance(id);
  if(!res.ok){
    toast(res.error,'error');
    await loadDate();
    return;
  }
  toast('Record deleted. It is now in Archived.','success');
}

async function deleteForDate(){
  if(!DAY_ROWS.length){ toast('There are no records for this date.','info'); return; }
  const ok = await confirmDelete(
    `Delete all ${DAY_ROWS.length} attendance record(s) for ${fmtDate(CURRENT_DATE)}? They can be restored from the Archived page.`,
    'Delete records for date'
  );
  if(!ok) return;

  const ids = DAY_ROWS.map(r=>r.id);
  DAY_ROWS = [];
  drawRows();
  const { error } = await sb.from('attendance').update({ deleted_at:new Date().toISOString() }).in('id', ids);
  if(error){ toast(error.message,'error'); await loadDate(); return; }
  window.__DB__.attendance = window.__DB__.attendance.filter(a=>!ids.includes(a.id));
  toast(`${ids.length} record(s) moved to Archived.`,'success');
}

render();
  subscribeRealtime(() => render());
</script>
