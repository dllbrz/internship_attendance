<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archived — Admin · Naic OJT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
async function render(){
  const admin = await requireAdmin(); if(!admin) return;
  const db = getDB();
  // Archived = interns whose account was archived by an admin (active=false)
  const list = db.students.filter(s => s.active === false);

  document.getElementById('shell').innerHTML = renderSidebar('admin','archived') + `
    <main class="main">
      ${renderTopbar('Archived', 'Interns archived from the active list. Restore or permanently delete records here.')}
      <div class="card">
        <div class="card-title">Archived Interns (${list.length})</div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>ID</th><th>Name</th><th>School</th><th>Period</th><th>Rendered</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </div>
    </main>

    <div class="modal" id="profileModal">
      <div class="modal-inner" style="max-width:560px">
        <div class="modal-head"><h3>Archived Intern</h3><button class="close-x" onclick="closeModal('profileModal')">×</button></div>
        <div class="modal-body" id="profileBody"></div>
        <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal('profileModal')">Close</button></div>
      </div>
    </div>

    <div class="modal" id="confirmDel">
      <div class="modal-inner" style="max-width:440px">
        <div class="modal-head"><h3>Permanently delete record?</h3><button class="close-x" onclick="closeModal('confirmDel')">×</button></div>
        <div class="modal-body">
          <p>This will <strong>permanently remove</strong> <span id="delName" style="color:var(--blue-900);font-weight:700"></span> and all of their attendance and requirement records. This action cannot be undone.</p>
          <div class="form-group" style="margin-top:12px">
            <label>Type <code>DELETE</code> to confirm</label>
            <input class="form-control" id="delConfirm" placeholder="DELETE" autocomplete="off">
          </div>
          <div class="form-error" id="delErr"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('confirmDel')">Cancel</button>
          <button class="btn" style="background:#c53030;color:#fff" onclick="confirmDelete()">Delete permanently</button>
        </div>
      </div>
    </div>`;
  startClock('#clockBox');
  drawRows();
}

function drawRows(){
  const list = getDB().students.filter(s => s.active === false);
  document.getElementById('rows').innerHTML = list.length ? list.map(s => {
    const done = totalHours(s.id);
    return `<tr>
      <td style="font-weight:700;color:var(--blue-800)">${s.id}</td>
      <td><div class="cell-name">${profileIconHTML(s,30)}<span class="name-text">${s.name}</span><div class="text-muted text-sm" style="margin-left:8px">${s.course||''}</div></div></td>
      <td>${s.school||'—'}</td>
      <td class="text-sm">${fmtDate(s.start_date)}<br><span class="text-muted">to ${fmtDate(s.end_date)}</span></td>
      <td><span class="pill ${done>=s.required_hours?'green':'gray'}">${done}/${s.required_hours} hrs</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-outline btn-sm" onclick="showProfile('${s.id}')">View</button>
        <button class="btn btn-primary btn-sm" onclick="unarchive('${s.id}')">Unarchive</button>
        <button class="btn btn-sm" style="background:#c53030;color:#fff" onclick="askDelete('${s.id}')">Delete Record</button>
      </td>
    </tr>`;
  }).join('') : '<tr><td colspan="6" class="text-center text-muted" style="padding:24px">No archived interns.</td></tr>';
}

function showProfile(id){
  const s = getDB().students.find(x=>x.id===id); if(!s) return;
  const done = totalHours(s.id);
  document.getElementById('profileBody').innerHTML = `
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">
      ${profileIconHTML(s,64)}
      <div><div style="font-size:17px;font-weight:700;color:var(--blue-900)">${s.name}</div>
      <div class="text-muted">${s.id}</div></div>
    </div>
    <div class="profile-view">
      <div class="pv-row"><span>Email</span><strong>${s.email||'—'}</strong></div>
      <div class="pv-row"><span>Phone</span><strong>${s.phone||'—'}</strong></div>
      <div class="pv-row"><span>School</span><strong>${s.school||'—'}</strong></div>
      <div class="pv-row"><span>Course</span><strong>${s.course||'—'}</strong></div>
      <div class="pv-row"><span>Adviser</span><strong>${s.adviser_name||'—'}</strong></div>
      <div class="pv-row"><span>Adviser Contact</span><strong>${s.adviser_contact||'—'}</strong></div>
      <div class="pv-row"><span>OJT Period</span><strong>${fmtDate(s.start_date)} – ${fmtDate(s.end_date)}</strong></div>
      <div class="pv-row"><span>Required Hours</span><strong>${s.required_hours} hrs</strong></div>
      <div class="pv-row"><span>Rendered Hours</span><strong>${done} hrs</strong></div>
    </div>`;
  openModal('profileModal');
}

async function unarchive(id){
  if(!confirm('Restore this intern to the active Students list?')) return;
  const r = await unarchiveStudent(id);
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Intern restored to active list.','success');
  drawRows();
}

let PENDING_DEL = null;
function askDelete(id){
  const s = getDB().students.find(x=>x.id===id); if(!s) return;
  PENDING_DEL = id;
  document.getElementById('delName').textContent = `${s.name} (${s.id})`;
  document.getElementById('delConfirm').value = '';
  document.getElementById('delErr').textContent = '';
  openModal('confirmDel');
}
async function confirmDelete(){
  const val = document.getElementById('delConfirm').value.trim();
  if(val !== 'DELETE'){ document.getElementById('delErr').textContent = 'Please type DELETE to confirm.'; return; }
  const r = await deleteStudent(PENDING_DEL);
  if(!r.ok){ document.getElementById('delErr').textContent = r.error; return; }
  closeModal('confirmDel'); PENDING_DEL = null;
  toast('Record permanently deleted.','success');
  drawRows();
}

render();
</script>
</body></html>
