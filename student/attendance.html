<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance — Intern · Engineering Office</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script>
/* Intern → Attendance history.
   This page is reached from the sidebar "Attendance" link and from the
   "See all" button in Dashboard → Recent Attendance. */
let DATE_Q = '';

async function render(){
  const user = await requireStudent(); if(!user) return;

  const all   = studentAttendance(user.id);
  const list  = DATE_Q ? all.filter(a=>String(a.date).includes(DATE_Q)) : all;
  const disp  = all.map(a=>attendanceDisplay(a, user));
  const total = totalHours(user.id);
  const presentCount = disp.filter(d=>d.key==='present').length;
  const lateCount    = disp.filter(d=>d.key==='late').length;
  const absentCount  = disp.filter(d=>d.key==='absent').length;
  const today  = getTodayAttendance(user.id);
  const todayD = attendanceDisplay(today, user);

  document.getElementById('shell').innerHTML = renderSidebar('student','attendance') + `
    <main class="main">
      ${renderTopbar('My Attendance','Review your complete attendance history and search it by date.')}

      <div class="stat-grid">
        <div class="stat-card"><div><div class="stat-label">Today</div>
          <div class="stat-value">${today ? todayD.label : 'No record'}</div>
          <div class="stat-meta">${fmtDate(todayStr())}</div></div>
          <div class="stat-icon">${STAT_ICONS.status}</div></div>
        <div class="stat-card green"><div><div class="stat-label">Total Rendered</div>
          <div class="stat-value">${total}</div><div class="stat-meta">of ${user.required_hours} hours required</div></div>
          <div class="stat-icon">${STAT_ICONS.hours}</div></div>
        <div class="stat-card"><div><div class="stat-label">Present Days</div>
          <div class="stat-value">${presentCount}</div><div class="stat-meta">${lateCount} late record(s)</div></div>
          <div class="stat-icon">${STAT_ICONS.present}</div></div>
        <div class="stat-card yellow"><div><div class="stat-label">Absent Days</div>
          <div class="stat-value">${absentCount}</div><div class="stat-meta">Days with no rendered hours</div></div>
          <div class="stat-icon">${STAT_ICONS.absent}</div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div><div class="card-title">Attendance History</div>
            <div class="card-subtitle">${list.length} of ${all.length} record(s)${DATE_Q?` · filtered by “${escapeHtml(DATE_Q)}”`:''}</div></div>
          <div class="flex gap-2" style="flex-wrap:wrap">
            <label class="sr-only" for="dateSearch">Search a date</label>
            <input class="form-control" id="dateSearch" style="width:210px" placeholder="Search date (e.g. 2026-08)"
                   aria-describedby="dateHint">
            <label class="sr-only" for="datePick">Pick a date</label>
            <input class="form-control" id="datePick" type="date" style="width:170px">
            ${DATE_Q?`<button class="btn btn-ghost btn-sm" onclick="clearSearch()">Clear</button>`:''}
            <button class="btn btn-outline btn-sm" onclick="csv()">Export CSV</button>
            <button class="btn btn-outline btn-sm" onclick="pdf()">Export PDF</button>
          </div>
        </div>
        <p class="text-sm text-muted" id="dateHint" style="margin:-4px 0 12px">
          Type a full date (2026-08-12), a month (2026-08) or a year (2026), or pick a day with the date picker.
        </p>
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Time In</th><th>Time Out</th><th>Hours</th><th>Status</th></tr></thead>
          <tbody>${list.length ? list.map(r=>{
            const d = attendanceDisplay(r, user);
            return `<tr>
              <td style="font-weight:600;color:var(--blue-800)">${fmtDate(r.date)}</td>
              <td>${fmt12(r.time_in)}</td>
              <td>${fmt12(r.time_out)}</td>
              <td>${d.key==='absent' ? '0.00' : Number(r.hours||0).toFixed(2)}</td>
              <td><span class="pill ${d.tone}">${d.label}</span>${r.note?`<div class="text-sm text-muted" style="margin-top:4px">${escapeHtml(r.note)}</div>`:''}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="5" class="text-center text-muted" style="padding:24px">${all.length?'No records match this date.':'No attendance records yet.'}</td></tr>`}</tbody>
        </table></div>
      </div>
    </main>`;

  startClock('#clockBox');

  const ds = document.getElementById('dateSearch');
  ds.value = DATE_Q;
  ds.addEventListener('input', e=>{ DATE_Q = e.target.value.trim(); render(); });
  if(DATE_Q){ ds.focus(); ds.setSelectionRange(ds.value.length, ds.value.length); }
  document.getElementById('datePick').addEventListener('change', e=>{ DATE_Q = e.target.value; render(); });
}

function clearSearch(){ DATE_Q=''; render(); }

async function csv(){
  const u = await requireStudent(); if(!u) return;
  const rows = [['Date','Time In','Time Out','Hours','Status']];
  studentAttendance(u.id).forEach(r=>{
    const d = attendanceDisplay(r,u);
    rows.push([r.date, r.time_in||'', r.time_out||'', d.key==='absent'?0:(r.hours||0), d.label]);
  });
  exportCSV(u.id+'-attendance.csv', rows);
}
async function pdf(){
  const u = await requireStudent(); if(!u) return;
  const rows = studentAttendance(u.id).map(r=>{
    const d = attendanceDisplay(r,u);
    return [fmtDate(r.date), fmt12(r.time_in), fmt12(r.time_out), d.key==='absent'?'0.00':Number(r.hours||0).toFixed(2), d.label];
  });
  exportPDF(u.id+'-attendance.pdf','Attendance History — '+u.name,['Date','Time In','Time Out','Hours','Status'],rows);
}

render();
</script>
</body></html>
