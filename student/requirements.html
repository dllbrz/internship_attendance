<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Requirements — Intern · Naic OJT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
let CURRENT = null;

async function render(){
  const u = await requireStudent(); if(!u) return;
  CURRENT = u;
  const reqs = u.requirements || [];
  document.getElementById('shell').innerHTML = renderSidebar('student','requirements') + `
    <main class="main">
      ${renderTopbar('My Requirements','Upload OJT documents. Select a document type from the list.')}

      <div class="card">
        <div class="card-title">Upload Document</div>
        <p class="text-muted text-sm">Accepted: PDF, DOC/DOCX, JPG, PNG.</p>

        <div class="form-group">
          <label>Document Type <span style="color:#c53030">*</span></label>
          <select id="label" class="form-control" onchange="onTypeChange()">
            <option value="">— Select a document type —</option>
            ${REQUIREMENT_TYPES.map(t=>`<option value="${t.label}">${t.label}</option>`).join('')}
          </select>
        </div>

        <div class="form-group" id="otherWrap" style="display:none">
          <label>Please specify (Others)</label>
          <input type="text" id="otherLabel" class="form-control" placeholder="e.g. Barangay Clearance">
        </div>

        <div class="form-group">
          <label for="files">Select one or more files</label>
          <input type="file" id="files" class="form-control" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="onPick(this)">
          <div class="file-chips" id="chips" aria-live="polite"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" id="upBtn" onclick="doUpload()">Upload Files</button>
          <button class="btn btn-outline" id="clearBtn" onclick="clearPicked()" style="display:none">Cancel All</button>
        </div>
        <div id="progress" style="margin-top:10px;font-size:13px;color:var(--gray-700)" aria-live="polite"></div>
      </div>

      <div class="card mt-4">
        <div class="card-title">Uploaded Files (${reqs.length})</div>
        ${reqs.length===0 ? '<p class="text-muted">No files uploaded yet.</p>' :
          '<div class="table-wrap"><table class="table"><thead><tr><th></th><th>File</th><th>Type</th><th>Size</th><th>Uploaded</th><th></th></tr></thead><tbody>'+
          reqs.map(r=>`<tr>
            <td><span class="file-icon">${fileIcon()}</span></td>
            <td>${r.name}</td>
            <td>${r.label||'—'}</td>
            <td>${humanSize(r.size)}</td>
            <td>${fmtDate(r.uploaded_at)}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-outline btn-sm" onclick="openFile('${r.path}')">View</button>
              <button class="btn btn-outline btn-sm" onclick="renameFile('${r.id}','${(r.name||'').replace(/'/g,"\\'")}')">Rename</button>
              <button class="btn btn-outline btn-sm" style="color:#c53030;border-color:#c53030" onclick="delFile('${r.id}')">Delete</button>
            </td></tr>`).join('')+
          '</tbody></table></div>'}
      </div>
    </main>`;
  startClock('#clockBox');
  drawChips();
}

/* ---- staged files: each chip has an "x" to cancel it before uploading ---- */
let PICKED = [];

function onPick(input){
  PICKED = PICKED.concat(Array.from(input.files || []));
  input.value = '';            // allow re-picking the same file after a cancel
  drawChips();
}
function cancelPick(i){
  const f = PICKED[i];
  PICKED.splice(i,1);
  drawChips();
  if(f) toast(`Removed “${f.name}”.`,'info');
}
function clearPicked(){
  if(!PICKED.length) return;
  PICKED = [];
  drawChips();
  toast('Selection cleared.','info');
}
function drawChips(){
  const wrap = document.getElementById('chips');
  if(!wrap) return;
  wrap.innerHTML = PICKED.map((f,i)=>`
    <span class="file-chip">
      <span title="${escapeAttr(f.name)}">${escapeHtml(f.name)}</span>
      <small class="text-muted">${humanSize(f.size)}</small>
      <button type="button" onclick="cancelPick(${i})" title="Remove this file"
              aria-label="Remove ${escapeAttr(f.name)} from the upload list">×</button>
    </span>`).join('');
  const clear = document.getElementById('clearBtn');
  if(clear) clear.style.display = PICKED.length ? '' : 'none';
  const btn = document.getElementById('upBtn');
  if(btn) btn.textContent = PICKED.length ? `Upload ${PICKED.length} File${PICKED.length===1?'':'s'}` : 'Upload Files';
}

function onTypeChange(){
  const val = document.getElementById('label').value;
  document.getElementById('otherWrap').style.display = (val==='Others') ? 'block' : 'none';
}
function resolveLabel(){
  const v = document.getElementById('label').value;
  if(!v) return '';
  if(v==='Others'){
    const custom = document.getElementById('otherLabel').value.trim();
    return custom ? `Others: ${custom}` : 'Others';
  }
  return v;
}

async function doUpload(){
  const files = PICKED;
  if(!files.length){ toast('Please pick at least one file.','error'); return; }
  const label = resolveLabel();
  if(!label){ toast('Please select a document type.','error'); return; }
  const btn = document.getElementById('upBtn'); btn.disabled=true; btn.textContent='Uploading…';
  const prog = document.getElementById('progress');
  let ok=0, fail=0;
  for(let i=0;i<files.length;i++){
    prog.textContent = `Uploading ${i+1} of ${files.length}: ${files[i].name}`;
    const r = await addStudentRequirement(CURRENT.id, files[i], label);
    if(r.ok) ok++; else fail++;
  }
  prog.textContent = '';
  PICKED = [];
  toast(`${ok} uploaded${fail?`, ${fail} failed`:''}.`, fail?'error':'success');
  render();
}
async function delFile(id){
  const req = (CURRENT.requirements||[]).find(r=>r.id===id);
  const ok = await confirmDelete(`Delete “${req ? req.name : 'this file'}”? This cannot be undone.`, 'Delete uploaded file');
  if(!ok) return;
  const r = await deleteStudentRequirement(CURRENT.id, id);
  if(r && r.ok === false){ toast(r.error,'error'); return; }
  toast('File deleted.','success'); render();
}
async function renameFile(id, currentName){
  const newName = prompt('New file name:', currentName);
  if(!newName || newName.trim()===currentName) return;
  const r = await renameStudentRequirement(CURRENT.id, id, newName);
  if(!r.ok){ toast(r.error,'error'); return; }
  toast('Renamed.','success'); render();
}
async function openFile(path){
  const url = await getRequirementUrl(path);
  if(url) window.open(url,'_blank'); else toast('Cannot open file.','error');
}
render();
</script>
</body>
</html>
