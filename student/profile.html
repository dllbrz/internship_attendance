<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile — Intern · Engineering Office</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell" id="shell"><div style="padding:40px;text-align:center">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/image-crop.js"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script>
let ME = null;

async function render(){
  try { await syncOwnEmailFromAuth(); } catch(_){}
  const u = await requireStudent(); if(!u) return;
  ME = u;
  document.getElementById('shell').innerHTML = renderSidebar('student','profile') + `
    <main class="main">
      ${renderTopbar('My Profile','View and edit your personal information, adviser, and requirements.')}
      <div class="card text-center" style="max-width:460px;margin:0 auto">
        <button type="button" class="avatar avatar-btn" onclick="openModal('picModal')"
                title="Change profile photo"
                aria-label="Profile photo options for ${escapeAttr(u.name||'')} — change, view or delete your photo"
                style="width:140px;height:140px;font-size:42px;margin:0 auto 12px;overflow:hidden;border-radius:50%;padding:0;border:0;cursor:pointer;position:relative;display:grid;place-items:center">
          ${u.avatar ? `<img src="${u.avatar}" alt="" style="width:100%;height:100%;object-fit:cover">` : (u.name||'U').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
          <span aria-hidden="true" class="avatar-btn-hint">Change Photo</span>
        </button>
        <h3 style="color:var(--blue-900);margin-bottom:2px">${u.name}</h3>
        <div class="text-muted text-sm">${u.id}</div>
        <div class="text-sm" style="font-weight:600;color:var(--blue-800);margin-top:2px">
          Diploma in Information Technology
        </div>
        <div class="mt-4" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="openEdit()">Edit Profile</button>
          <button class="btn btn-yellow btn-sm" onclick="generateTimeCard()">Generate Time Card</button>
        </div>
        <hr style="margin:20px 0;border:none;border-top:1px solid var(--gray-200)">
        <div style="text-align:left">
          <button type="button" class="btn btn-outline disclosure-btn" id="piToggle"
                  aria-expanded="false" aria-controls="piPanel" onclick="togglePersonalInfo()"
                  style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <span>Personal Information</span>
            <span aria-hidden="true" id="piCaret" style="transition:transform .18s ease">▾</span>
          </button>
          <div id="piPanel" hidden style="margin-top:12px">
            <div class="text-muted text-sm">Required Hours</div><div style="font-weight:700;color:var(--blue-800)">${u.required_hours} hrs</div>
            <div class="text-muted text-sm mt-2">OJT Period</div><div style="font-weight:600">${fmtDate(u.start_date)} – ${fmtDate(u.end_date)}</div>
            <div class="text-muted text-sm mt-2">School</div><div style="font-weight:600">${u.school||'—'}</div>
            <div class="text-muted text-sm mt-2">Course</div><div style="font-weight:600">${u.course||'—'}</div>
            <div class="text-muted text-sm mt-2">OJT Adviser</div><div style="font-weight:600">${u.adviser_name||'—'}</div>
            <div class="text-muted text-sm mt-2">Adviser Contact</div><div style="font-weight:600">${u.adviser_contact||'—'}</div>

            <hr style="margin:16px 0;border:none;border-top:1px solid var(--gray-200)">
            <div class="text-muted text-sm">Email</div><div style="font-weight:600">${u.email||'—'}</div>
            <div class="text-muted text-sm mt-2">Phone</div><div style="font-weight:600">${u.phone||'—'}</div>
            <div class="text-muted text-sm mt-2">Address</div><div style="font-weight:600">${u.address||'—'}</div>

            <hr style="margin:16px 0;border:none;border-top:1px solid var(--gray-200)">
            <div class="text-muted text-sm" style="font-weight:700;color:var(--blue-900);text-transform:none;font-size:13px">Progress</div>
            <div style="font-size:14px;color:var(--gray-700);margin:4px 0 6px">
              ${totalHours(u.id)} / ${u.required_hours} hours rendered
            </div>
            <div style="height:10px;background:#eef2f7;border-radius:6px;overflow:hidden">
              <div style="height:100%;background:linear-gradient(90deg,#0d2b6b,#123a8a);width:${Math.min(100,(totalHours(u.id)/u.required_hours*100)).toFixed(1)}%"></div>
            </div>
          </div>
        </div>
        <hr style="margin:20px 0;border:none;border-top:1px solid var(--gray-200)">
        <div class="qr-display">
          <div class="card-title" style="margin-bottom:8px">My QR Code</div>
          <div id="qr" style="display:inline-block"></div>
          <div style="font-weight:700;color:var(--blue-800);margin-top:6px">${u.id}</div>
          <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-outline btn-sm" onclick="viewQR('qr','${u.id}','${escapeAttr(u.name||'')} · ${escapeAttr(u.id||'')}')">View</button>
            <button class="btn btn-primary btn-sm" onclick="downloadQR('${u.id}')">Download QR Code</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Profile picture options modal -->
    <div class="modal" id="picModal" role="dialog" aria-modal="true" aria-label="Profile picture options">
      <div class="modal-inner" style="max-width:400px">
        <div class="modal-head"><h3>Profile Picture</h3><button class="close-x" aria-label="Close" onclick="closeModal('picModal')">&times;</button></div>
        <div class="modal-body">
          <div class="view-menu">
            <input type="file" id="picFile" accept="image/*" style="display:none" onchange="uploadPic(event)">
            <button type="button" onclick="viewPhoto()" ${u.avatar ? '' : 'disabled'}>View Photo</button>
            <button type="button" onclick="document.getElementById('picFile').click()">Change Photo</button>
            <button type="button" class="danger" onclick="removePic()" ${u.avatar ? '' : 'disabled'}>Delete Photo</button>
          </div>
          <p class="text-muted text-sm mt-3">Photos should be a clear headshot. JPG or PNG, under 5 MB works best.</p>
        </div>
        <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal('picModal')">Close</button></div>
      </div>
    </div>

    <!-- Photo viewer modal -->
    <div class="modal" id="viewPicModal" role="dialog" aria-modal="true" aria-label="Profile photo">
      <div class="modal-inner" style="max-width:520px">
        <div class="modal-head"><h3>My Photo</h3><button class="close-x" aria-label="Close" onclick="closeModal('viewPicModal')">&times;</button></div>
        <div class="modal-body">
          <img id="picPreview" class="photo-preview" alt="Your profile photo" src="">
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('viewPicModal')">Close</button>
          <button class="btn btn-primary" onclick="closeModal('viewPicModal');openModal('picModal')">Photo Options</button>
        </div>
      </div>
    </div>

    <!-- Edit profile modal -->
    <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-label="Edit my profile">
      <div class="modal-inner" style="max-width:520px">
        <div class="modal-head"><h3>Edit My Profile</h3><button class="close-x" aria-label="Close" onclick="closeModal('editModal')">&times;</button></div>
        <div class="modal-body">
          <div class="form-group"><label for="f_name">Full Name</label><input class="form-control" id="f_name"></div>
          <div class="form-group">
            <label for="f_email">Email Address</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <input class="form-control" id="f_email" type="email" autocomplete="email"
                     style="flex:1;min-width:200px" aria-describedby="f_emailHint">
              <button type="button" class="btn btn-outline" id="f_emailBtn" onclick="saveEmail()">Change Email</button>
            </div>
            <p class="text-sm text-muted" id="f_emailHint" style="margin-top:4px">
              Changing your email sends a confirmation link. Keep using your current email to sign in until you confirm it.
            </p>
          </div>
          <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div class="form-group"><label>Phone</label><input class="form-control" id="f_phone"></div>
            <div class="form-group"><label>School</label><input class="form-control" id="f_school"></div>
          </div>
          <div class="form-group"><label>Course</label><input class="form-control" id="f_course"></div>
          <div class="form-group"><label>Address</label><textarea class="form-control" id="f_addr" rows="2"></textarea></div>
          <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div class="form-group"><label>Adviser Name</label><input class="form-control" id="f_adv"></div>
            <div class="form-group"><label>Adviser Contact</label><input class="form-control" id="f_advc"></div>
          </div>
          <div class="form-error" id="f_err"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
          <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
        </div>
      </div>
    </div>`;
  startClock('#clockBox');
  new QRCode(document.getElementById('qr'), { text:u.qr_token, width:160, height:160, colorDark:'#0d2b6b', colorLight:'#fff' });
}
function viewPhoto(){
  const src = (ME && (ME.avatar || ME.avatar_url)) || '';
  if(!src){ toast('No photo uploaded yet.','info'); return; }
  const img = document.getElementById('picPreview');
  img.src = src;
  closeModal('picModal');
  openModal('viewPicModal');
}
function togglePersonalInfo(){
  const btn = document.getElementById('piToggle');
  const panel = document.getElementById('piPanel');
  const caret = document.getElementById('piCaret');
  if(!btn || !panel) return;
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', open ? 'false' : 'true');
  panel.hidden = open;
  if(caret) caret.style.transform = open ? '' : 'rotate(180deg)';
}
function openEdit(){
  document.getElementById('f_email').value = (ME.email || '');
  document.getElementById('f_name').value = ME.name || '';
  document.getElementById('f_phone').value = ME.phone || '';
  document.getElementById('f_school').value = ME.school || '';
  document.getElementById('f_course').value = ME.course || '';
  document.getElementById('f_addr').value = ME.address || '';
  document.getElementById('f_adv').value = ME.adviser_name || '';
  document.getElementById('f_advc').value = ME.adviser_contact || '';
  openModal('editModal');
}
async function saveProfile(){
  const patch = {
    full_name: document.getElementById('f_name').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    school: document.getElementById('f_school').value.trim(),
    course: document.getElementById('f_course').value.trim(),
    address: document.getElementById('f_addr').value.trim(),
    adviser_name: document.getElementById('f_adv').value.trim(),
    adviser_contact: document.getElementById('f_advc').value.trim(),
  };
  const err = document.getElementById('f_err');
  err.textContent = '';
  if(!patch.full_name){ err.textContent = 'Full name is required.'; return; }
  const r = await updateOwnProfile(patch);
  if(!r.ok){ err.textContent = r.error; return; }
  closeModal('editModal'); toast('Profile updated.','success'); render();
}
// Email is changed through Supabase Auth (confirmation link), never through
// updateOwnProfile — so it is kept separate from Save Changes.
async function saveEmail(){
  const err = document.getElementById('f_err');
  const input = document.getElementById('f_email');
  const btn = document.getElementById('f_emailBtn');
  err.textContent = '';
  const email = (input.value || '').trim().toLowerCase();
  if(!email){ err.textContent = 'Enter your new email address.'; input.focus(); return; }
  if(typeof isValidEmail === 'function' ? !isValidEmail(email) : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    err.textContent = 'Enter a valid email address.'; input.focus(); return;
  }
  if(email === String(ME.email || '').toLowerCase()){
    err.textContent = 'That is already your email address.'; return;
  }
  const ok = await confirmDialog({
    title: 'Change email address',
    message: `Send a One Time Pin to ${email}? You will be asked to enter that pin to finish the change.`,
    confirmText: 'Send One Time Pin',
    danger: false
  });
  if(!ok) return;
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Sending…';
  const r = await requestEmailChangeOtp(email);
  btn.disabled = false; btn.textContent = label;
  if(!r.ok){ err.textContent = r.error; return; }
  toast('One Time Pin sent to '+email+'.','success');
  await verifyStudentEmailChange(email);
}

// Pop-up verification: One Time Pin + the word CONFIRM.
async function verifyStudentEmailChange(email){
  const err = document.getElementById('f_err');
  for(;;){
    const res = await otpConfirmDialog({
      title: 'Verify your new email address',
      message: 'We emailed a One Time Pin to '+email+'. Enter the pin, then type CONFIRM to change your email address.',
      email,
      confirmText: 'Verify & Change Email',
      onResend: async () => {
        const again = await requestEmailChangeOtp(email);
        toast(again.ok ? 'A new One Time Pin was sent to '+email+'.' : (again.error||'Could not resend the pin.'),
              again.ok ? 'success' : 'error');
      }
    });
    if(!res){ toast('Email change cancelled. Your current email address is unchanged.','info'); return; }
    const v = await verifyEmailChangeOtp(email, res.code);
    if(v.ok && v.applied){
      if(err) err.textContent = '';
      toast('Email address changed to '+email+'.','success');
      if(typeof ME === 'object' && ME) ME.email = email;
      closeModal('editModal');
      render();
      return;
    }
    if(v.ok && !v.applied){
      // Pin was correct, but the address has NOT changed yet — this project
      // requires a second confirmation from the old inbox. Say so plainly
      // instead of claiming success, and leave the current email untouched.
      toast(v.error, 'info');
      closeModal('editModal');
      return;
    }
    if(err) err.textContent = v.error;
  }
}
function downloadQR(filename){
  const holder = document.getElementById('qr');
  if(!holder){ toast('QR not ready yet.','error'); return; }
  const canvas = holder.querySelector('canvas');
  const img = holder.querySelector('img');
  let dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
  if(!dataUrl){ toast('QR not ready yet.','error'); return; }
  const a = document.createElement('a');
  a.href = dataUrl; a.download = (filename||'qr-code')+'.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('QR code downloaded.','success');
}
async function uploadPic(e){
  const input = e.target;
  const f = input.files[0];
  // reset so re-selecting the same file re-triggers change
  try { input.value = ''; } catch(_){}
  if(!f) return;
  if(f.size > 15*1024*1024){ toast('Image too large (max 15 MB before cropping).','error'); return; }
  let blob;
  try {
    blob = await window.openImageCropper(f, {
      aspectRatio: 1, outputSize: 512, filename: 'avatar.png', mimeType: 'image/png'
    });
  } catch(err){
    // user cancelled — silent
    return;
  }
  // give the blob a filename so uploadAvatar can derive extension
  const cropped = new File([blob], 'avatar.png', { type: blob.type || 'image/png' });
  toast('Uploading…','info');
  const r = await uploadAvatar(cropped);
  if(!r.ok){ toast(r.error,'error'); return; }
  closeModal('picModal');
  toast('Photo updated.','success'); render();
}
async function removePic(){
  if(!confirm('Delete your profile photo? This will restore the default avatar.')) return;
  const r = await deleteOwnAvatar();
  if(!r.ok){ toast(r.error,'error'); return; }
  closeModal('picModal');
  toast('Photo removed.','success'); render();
}

// ---------- PRINTABLE TIME CARD (3.5" x 7.5" — standard bundy-card size) ----------
// Intentionally intern-only: no Rate/Amount/Deductions/Net Pay fields like an
// employee payroll card. Summary only counts Present / Absent (no "Late") per
// office policy — the daily table below still shows each day's real status.
function generateTimeCard(){
  const u = ME; if(!u){ toast('Not ready','error'); return; }
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('PDF library still loading. Try again.','error'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:[252, 540] }); // 3.5 x 7.5 in
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 14; // left/right margin
  const shortDate = iso => { if(!iso) return '—'; const d=new Date(iso);
    return d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit'}); };
  const shortTime = t => { if(isBlankTime(t)) return '--:--'; const [h,m]=String(t).split(':').map(Number);
    const ap=h>=12?'p':'a'; const hh=((h+11)%12)+1; return `${hh}:${String(m).padStart(2,'0')}${ap}`; };

  doc.setFillColor(10,31,68); doc.rect(0,0,W,46,'F');
  doc.setTextColor(253,194,43); doc.setFontSize(10.5); doc.text('OFFICIAL TIME CARD', M, 19);
  doc.setTextColor(255,255,255); doc.setFontSize(6.8);
  doc.text('Municipal Engineering Office', M, 30);
  doc.text('OJT Program', M, 39);

  doc.setTextColor(20,20,20); doc.setFontSize(7.3);
  let y = 62;
  const row = (label,value)=>{ doc.setFont(undefined,'bold'); doc.text(label,M,y);
    doc.setFont(undefined,'normal');
    const lines = doc.splitTextToSize(String(value||'—'), W-M-60);
    doc.text(lines,62,y); y += 10*lines.length; };
  row('Name:',u.name); row('Intern ID:',u.id); row('School:',u.school);
  row('Course:',u.course); row('Adviser:',u.adviser_name);
  row('OJT Period:',`${fmtDate(u.start_date)} – ${fmtDate(u.end_date)}`);
  row('Req. Hours:',`${u.required_hours} hrs`);

  const list = studentAttendance(u.id).slice().reverse();
  const rendered = totalHours(u.id);
  const present = list.filter(r=>r.status==='present').length;
  const absent = list.filter(r=>r.status==='absent').length;

  y+=3; doc.setDrawColor(210,215,225); doc.line(M,y,W-M,y); y+=11;
  doc.setFont(undefined,'bold'); doc.setFontSize(7.6); doc.text('SUMMARY',M,y); y+=10;
  doc.setFont(undefined,'normal'); doc.setFontSize(7.3);
  doc.text(`Hours Rendered: ${rendered} / ${u.required_hours}`,M,y); y+=10;
  doc.text(`Present: ${present}    Absent: ${absent}`,M,y);

  const body = list.map(r=>[shortDate(r.date),shortTime(r.time_in),shortTime(r.time_out),
    Number(r.hours||0).toFixed(1),(r.status||'').slice(0,4).toUpperCase()]);
  doc.autoTable({ startY:y+9, head:[['Date','In','Out','Hrs','Stat']],
    body: body.length?body:[['—','—','—','—','—']], theme:'grid',
    margin:{left:M,right:M},
    headStyles:{fillColor:[13,43,107],textColor:255,fontSize:6.6,halign:'center',cellPadding:2},
    styles:{fontSize:6.3,cellPadding:2,halign:'center'},
    columnStyles:{0:{halign:'left',cellWidth:38},1:{cellWidth:34},2:{cellWidth:34},
      3:{cellWidth:26},4:{cellWidth:'auto'}},
    alternateRowStyles:{fillColor:[242,247,255]} });

  const sigY = Math.min(H-40, (doc.lastAutoTable?doc.lastAutoTable.finalY:y)+26);
  doc.setFontSize(6.8); doc.setTextColor(20,20,20);
  doc.line(M+4,sigY,W/2-6,sigY); doc.line(W/2+6,sigY,W-M-4,sigY);
  doc.text('Intern',M+16,sigY+9); doc.text('Adviser',W/2+18,sigY+9);
  doc.setFontSize(5.8); doc.setTextColor(120,120,120);
  doc.text('Generated '+new Date().toLocaleDateString(),M,H-8);
  doc.save(`time-card-${u.id}.pdf`); toast('Time card generated.','success');
}

render();
subscribeRealtime(() => render());
</script>
</body>
</html>
